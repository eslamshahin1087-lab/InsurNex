<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>InsurNex — غير متصل</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(440px, 100%); padding: 32px 24px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 16px 40px #0f172a0d; }
      img { width: 72px; height: 72px; margin-bottom: 12px; }
      h1 { margin: 8px 0; font-size: 24px; }
      p { color: #475569; line-height: 1.9; }
      button { margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 12px; color: #fff; background: #0ea5e9; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.svg" alt="" />
      <h1>InsurNex</h1>
      <p>لا يوجد اتصال بالإنترنت حاليًا. أعد الاتصال ثم حاول مرة أخرى للوصول إلى بيانات العملاء والوثائق بأمان.</p>
      <p>لأسباب تتعلق بالخصوصية، لا يحتفظ التطبيق ببيانات العملاء أو المطالبات الطبية للعمل دون اتصال.</p>
      <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
