        /* ===== CHAT ===== */
        .chat-fab {
            position: absolute;
            bottom: 100px;
            right: 12px;
            z-index: 999;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient-navy);
            color: #fff;
            border: none;
            box-shadow: 0 8px 30px rgba(14, 42, 92, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulse-fab 2s ease-in-out infinite;
        }

        .chat-fab:hover {
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 12px 40px rgba(14, 42, 92, 0.5);
        }

        .chat-fab:active {
            transform: scale(0.95);
        }

        .chat-fab .fab-icon {
            font-size: 24px;
            line-height: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-fab .fab-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 20px;
            min-width: 20px;
            text-align: center;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(201, 84, 62, 0.4);
            animation: bounce-badge 1s ease-in-out infinite;
        }

        .chat-fab .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(242, 189, 99, 0.3);
            animation: ring-pulse 2s ease-out infinite;
        }

        .chat-fab .pulse-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        @keyframes pulse-fab {
            0%,
            100% {
                box-shadow: 0 8px 30px rgba(14, 42, 92, 0.4);
            }
            50% {
                box-shadow: 0 8px 50px rgba(14, 42, 92, 0.6), 0 0 30px rgba(242, 189, 99, 0.2);
            }
        }

        @keyframes ring-pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        @keyframes bounce-badge {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .chat-widget {
            position: absolute;
            bottom: 175px;
            right: 12px;
            width: min(340px, 90vw);
            max-height: 420px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
            border: 1px solid var(--line);
        }

        .chat-widget.open {
            display: flex;
        }

        .chat-widget .chat-header {
            background: var(--gradient-navy);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-widget .chat-header .chat-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-ar);
            font-weight: 700;
            font-size: 14px;
        }

        .chat-widget .chat-header .chat-title .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            display: inline-block;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .chat-widget .chat-header .close-chat {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-widget .chat-header .close-chat:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .chat-widget .chat-messages {
            flex: 1;
            padding: 10px 14px;
            overflow-y: auto;
            max-height: 280px;
            background: var(--paper);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-widget .chat-messages .msg {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            line-height: 1.5;
            animation: slideUp 0.3s ease;
        }

        .chat-widget .chat-messages .msg.user {
            align-self: flex-end;
            background: var(--gold-soft);
            color: var(--slate);
            border-bottom-right-radius: 4px;
        }

        .chat-widget .chat-messages .msg.agent {
            align-self: flex-start;
            background: var(--navy);
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        .chat-widget .chat-messages .msg .msg-time {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 3px;
            display: block;
        }

        .chat-widget .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid var(--line);
            background: var(--card);
            flex-shrink: 0;
        }

        .chat-widget .chat-input-area input {
            flex: 1;
            border: 1.5px solid var(--line);
            border-radius: 20px;
            padding: 8px 14px;
            outline: none;
            font-size: 13px;
            transition: all var(--transition);
            background: var(--paper);
            color: var(--slate);
        }

        .chat-widget .chat-input-area input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(242, 189, 99, 0.15);
        }

        .chat-widget .chat-input-area button {
            background: var(--gradient-gold);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 16px;
            color: var(--navy);
            flex-shrink: 0;
        }

        .chat-widget .chat-input-area button:hover {
            transform: scale(1.05);
            background: #e2af5a;
        }

        /* ===== WHATSAPP FAB (draggable) ===== */
        .whatsapp-fab {
            position: absolute;
            bottom: 100px;
            right: 12px;
            z-index: 998;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #25D366, #128C7E);
            color: #fff;
            border: none;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: box-shadow 0.3s ease;
            touch-action: none;
            user-select: none;
            animation: pulse-fab-wa 2s ease-in-out infinite;
        }

        .whatsapp-fab:active {
            cursor: grabbing;
            transition: none;
        }

        .whatsapp-fab.dragging {
            box-shadow: 0 14px 40px rgba(37, 211, 102, 0.6);
            animation: none;
        }

        .whatsapp-fab .fab-icon {
            position: relative;
            display: flex;
        }

        .whatsapp-fab .fab-icon svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .whatsapp-fab .pulse-ring.wa {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(37, 211, 102, 0.35);
            animation: ring-pulse 2s ease-out infinite;
            pointer-events: none;
        }

        .whatsapp-fab .pulse-ring.wa:nth-child(2) {
            animation-delay: 0.5s;
        }

        @keyframes pulse-fab-wa {
            0%,
            100% {
                box-shadow: 0 8px 30px rgba(37, 211, 102, 0.45);
            }
            50% {
                box-shadow: 0 8px 50px rgba(37, 211, 102, 0.65), 0 0 30px rgba(37, 211, 102, 0.25);
            }
        }

        /* ===== WHEEL ===== */
        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }

        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
        }

        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            cursor: pointer;
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid var(--red);
            z-index: 10;
            filter: drop-shadow(0 2px 8px rgba(201, 84, 62, 0.3));
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient-gold);
            display: grid;
            place-items: center;
            font-size: 20px;
            font-weight: 900;
            color: var(--navy);
            box-shadow: 0 0 0 4px var(--card), 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 5;
            font-family: var(--font-ar);
            cursor: pointer;
            transition: all var(--transition);
        }

        .wheel-center:hover {
            transform: translate(-50%, -50%) scale(1.08);
        }

        .wheel-center:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .wheel-center .app-icon {
            width: 30px;
            height: 30px;
            animation: uiPulseSoft 1.8s ease-in-out infinite;
        }

        @keyframes uiPulseSoft {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 0 rgba(244, 192, 107, 0))
            }
            50% {
                transform: scale(1.07);
                filter: drop-shadow(0 5px 12px rgba(244, 192, 107, .28))
            }
        }

        .wheel-result {
            margin-top: 16px;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            background: var(--gold-soft);
            border: 2px solid var(--gold);
            text-align: center;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--slate);
            width: 100%;
            transition: all 0.5s ease;
            gap: 10px;
        }

        .wheel-result .result-icon {
            font-size: 28px;
        }

        .wheel-result.wheel-result-success {
            background: var(--green-light) !important;
            border-color: var(--green) !important;
            animation: celebrate-bounce 0.6s ease-in-out 2;
        }

        .wheel-result.wheel-result-fail {
            background: var(--red-light) !important;
            border-color: var(--red) !important;
        }

        @keyframes celebrate-bounce {
            0%,
            100% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.15);
            }
            60% {
                transform: scale(0.9);
            }
            80% {
                transform: scale(1.05);
            }
        }

        .wheel-spin-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: var(--gradient-gold);
            color: var(--navy);
            font-family: var(--font-ar);
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 20px rgba(242, 189, 99, 0.3);
            margin-top: 10px;
            width: 100%;
        }

        .wheel-spin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(242, 189, 99, 0.4);
        }

        .wheel-spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .wheel-disabled {
            text-align: center;
            padding: 20px;
            color: var(--muted);
        }

        .wheel-disabled .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .wheel-disabled h3 {
            font-family: var(--font-ar);
            color: var(--slate);
            margin: 0 0 8px;
        }

        .wheel-info {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin-top: 8px;
        }

        .wheel-celebration {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            pointer-events: none;
            display: none;
            overflow: hidden;
        }

        .wheel-celebration.active {
            display: block;
            pointer-events: auto;
        }

        .wheel-celebration .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            animation: confetti-fall 3s ease-in forwards;
            top: -20px;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(400px) rotate(720deg);
                opacity: 0;
            }
        }

        .wheel-celebration .celebrate-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-ar);
            font-size: 28px;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 4px 30px rgba(242, 189, 99, 0.5);
            animation: celebrate-bounce 1s ease-in-out 3;
            text-align: center;
            background: rgba(14, 42, 92, 0.85);
            padding: 20px 35px;
            border-radius: 20px;
            border: 3px solid var(--gold);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            pointer-events: none;
            min-width: 200px;
        }

        .wheel-celebration .celebrate-text .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 6px;
        }

        .wheel-celebration .celebrate-text .sub {
            font-size: 14px;
            font-weight: 400;
            color: var(--gold-2);
        }

        /* ===== NOTIFICATIONS ===== */
        .notif {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            gap: 12px;
            margin: 10px 14px;

            transition: all var(--transition);

        .notif:hover {

            transform: translateX(-4px);

        .notif.unread {
            border-color: var(--gold);
            background: var(--gold-soft);

        .notif .ic {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            background: var(--gold-soft);
            color: var(--navy);

            align-items: center;
            justify-content: center;
            font-size: 18px;

        .notif h4 {

            color: var(--slate);
            font-size: 12.5px;
            font-weight: 700;

        .notif p {

            color: var(--muted);

            line-height: 1.4;

            background:

                linear-gradient(180deg, #101624 0%, var(--paper) 100%);

  function roles(){
    const r=state.profile?.roles||[];
    return Array.isArray(r)?r:[String(r)];
  }
  function hasRole(...wanted){const r=roles();return wanted.some(x=>r.includes(x));}
  function isPlatformAdmin(){return ["superAdmin","platformAdmin"].includes(state.adminRole)||["superAdmin","platformAdmin"].some(x=>roles().includes(x));}
  function can(module,action="read"){
    if(isPlatformAdmin())return true;
    const r=roles();
    if(action==="read")return true;
    if(["settings","team","subscriptions"].includes(module))return r.some(x=>["organizationOwner","organizationAdmin","manager"].includes(x));
    if(module==="commissions")return r.some(x=>["organizationOwner","organizationAdmin","manager","finance","broker"].includes(x));
    if(module==="claims")return r.some(x=>["organizationOwner","organizationAdmin","manager","broker","claimsOfficer","operations"].includes(x));
    if(module==="policies"||module==="quotations"||module==="opportunities")return r.some(x=>["organizationOwner","organizationAdmin","manager","broker","salesAgent","operations"].includes(x));
    if(module==="customers"||module==="leads")return r.some(x=>["organizationOwner","organizationAdmin","manager","broker","salesAgent","customerService"].includes(x));
    return r.some(x=>["organizationOwner","organizationAdmin","manager","broker","salesAgent","customerService","operations","claimsOfficer","finance"].includes(x));
  }

  async function loadIdentity(){
    const u=auth.currentUser;
    state.user=u;
    if(!u){state.profile=null;state.memberships=[];return null;}
    state.adminRole=null;
    for(const col of ["admins","admin"]){try{const a=await db.collection(col).doc(u.uid).get();
      if(a.exists&&a.data().status!=="disabled"&&a.data().active!==false){state.adminRole=a.data().role||"platformAdmin";break;}}catch(_){}}
    const userRef=db.collection("users").doc(u.uid);
    const snap=await userRef.get();
    if(!snap.exists){
      // Safe recovery for an authenticated legacy account with no users/{uid} document.
      // This creates a real profile only; it never creates placeholder business records.
      const now=firebase.firestore.FieldValue.serverTimestamp();
      const fallback={uid:u.uid,email:u.email||"",fullName:u.displayName||"",name:u.displayName||"",phone:"",mobile:"",
        accountType:"individual_broker",role:"broker_owner",roles:["broker"],organizationId:null,photoURL:u.photoURL||null,
        country:"",city:"",status:"active",emailVerified:!!u.emailVerified,onboardingCompleted:false,onboardingComplete:false,
        createdAt:now,updatedAt:now};
      await userRef.set(fallback,{merge:true});
      await db.collection("brokerProfiles").doc(u.uid).set({userId:u.uid,createdAt:now,updatedAt:now},{merge:true});
      state.profile=fallback;
    }else{
      const raw=snap.data()||{};
      const legacyRoles=Array.isArray(raw.roles)?raw.roles:(raw.role?[raw.role]:[]);
      state.profile={...raw,
        uid:raw.uid||u.uid,
        fullName:raw.fullName||raw.name||u.displayName||"",
        name:raw.name||raw.fullName||u.displayName||"",
        phone:raw.phone||raw.mobile||"",
        mobile:raw.mobile||raw.phone||"",
        role:raw.role||(legacyRoles[0]||"broker_owner"),
        roles:legacyRoles.length?legacyRoles:["broker"],
        emailVerified:typeof raw.emailVerified==="boolean"?raw.emailVerified:!!u.emailVerified,
        onboardingCompleted:typeof raw.onboardingCompleted==="boolean"?raw.onboardingCompleted:!!raw.onboardingComplete,
        onboardingComplete:typeof raw.onboardingComplete==="boolean"?raw.onboardingComplete:!!raw.onboardingCompleted
      };
      // Backfill only self-editable profile aliases. Role and organizationId are intentionally
      // not changed here because they are authorization-sensitive fields in Firestore Rules.
      const patch={};
      if(!raw.fullName&&raw.name)patch.fullName=raw.name;
      if(!raw.phone&&raw.mobile)patch.phone=raw.mobile;
      if(typeof raw.onboardingCompleted!=="boolean"&&typeof raw.onboardingComplete==="boolean")patch.onboardingCompleted=raw.onboardingComplete;
      if(typeof raw.emailVerified!=="boolean")patch.emailVerified=!!u.emailVerified;
      if(Object.keys(patch).length){patch.updatedAt=firebase.firestore.FieldValue.serverTimestamp();await userRef.update(patch);}
    }
    const ms=await db.collection("organizationMembers").where("userId","==",u.uid).limit(30).get();
    state.memberships=ms.docs.map(d=>({id:d.id,...d.data()}));
    const saved=localStorage.getItem("insurnex-workspace");
    if(saved){try{const p=JSON.parse(saved);if(p.type==="organization"&&state.memberships.some(m=>m.organizationId===p.id))state.workspace=p;}catch{}}
    if(state.workspace.id===null&&state.memberships.length===0)state.workspace={type:"personal",id:null,name:t("personalWorkspace")};
    if(state.memberships.length && !state.memberships.some(m=>m.organizationId===state.workspace.id))state.workspace={type:"organization",id:state.memberships[0].organizationId,name:state.memberships[0].organizationName||t("organizationWorkspace")};

  function scopedQuery(name,workspace=state.workspace,limit=100){
    let q=db.collection(name);
    if(workspace.type==="organization"&&workspace.id){
      q=q.where("organizationId","==",workspace.id).where("workspaceType","==","organization");
    }else{
      q=q.where("ownerId","==",auth.currentUser.uid).where("workspaceType","==","personal");
    }
    return q.limit(Math.max(1,Math.min(limit,100)));
  }

  function docPayload(data={},workspace=state.workspace){
    const user=auth.currentUser;
    if(!user)throw new Error("Not authenticated");
    return {
      ...data,
      workspaceType:workspace.type,
      organizationId:workspace.type==="organization"?workspace.id:null,
      ownerId:user.uid,
      createdBy:user.uid,
      createdAt:data.createdAt||firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
  }

  async function queryDocs(collection,workspace=state.workspace,limit=100){
    const key=collection+"|"+workspace.type+"|"+(workspace.id||"personal")+"|"+limit;
    if(state.cache.has(key))return state.cache.get(key);
    let snap;
    if(collection==="insurers"||collection==="insuranceProducts"){
      snap=await db.collection(collection).where("status","==","active").limit(Math.max(1,Math.min(limit,100))).get();
    } else {
      snap=await scopedQuery(collection,workspace,limit).get();
    }
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    rows.sort((a,b)=>{
      const ta=a.createdAt?.toMillis?a.createdAt.toMillis():Date.parse(a.createdAt||"");
      const tb=b.createdAt?.toMillis?b.createdAt.toMillis():Date.parse(b.createdAt||"");
      return (tb||0)-(ta||0);
    });
    state.cache.set(key,rows);
    return rows;
  }

  async function syncRenewalAutomation(policies,existingRenewals){
    function checkpoint(days){
      if(days<=0)return "Expired";
      if(days<=7)return "7 Days";
      if(days<=15)return "15 Days";
      if(days<=30)return "30 Days";
      if(days<=45)return "45 Days";
      if(days<=60)return "60 Days";
      if(days<=90)return "90 Days";
      return null;
    }
    var current=existingRenewals||[];
    for(var i=0;i<policies.length;i++){
      var p=policies[i],expiry=p.expiryDate?new Date(p.expiryDate):null;
      if(!expiry||Number.isNaN(expiry.getTime()))continue;
      var days=Math.ceil((expiry.getTime()-Date.now())/86400000),stage=checkpoint(days);
      if(!stage)continue;
      var exists=current.some(function(r){return (r.policyId===p.id||r.policyNumber===p.policyNumber)&&r.stage===stage;});
      if(exists)continue;
      var key=String(p.id||p.policyNumber||"policy").replace(/[^a-zA-Z0-9_-]/g,"_")+"_"+stage.replace(/\s+/g,"_");
      var renewalData=InsurNex.docPayload({policyId:p.id,policyNumber:p.policyNumber||"",customerId:p.customerId||null,customerName:p.customerName||"",expiryDate:p.expiryDate,stage:stage,status:"Open",assignedBrokerName:state.profile?.name||""});
      await db.collection("renewals").doc(key).set(renewalData,{merge:true});
      await db.collection("tasks").doc(key+"_task").set(InsurNex.docPayload({title:"Renew "+(p.policyNumber||"policy"),description:"Policy expires in "+days+" days.",dueDate:p.expiryDate,priority:days<=15?"high":"medium",status:"To Do",linkedEntityType:"renewal",linkedEntityId:key}),{merge:true});
      await db.collection("notifications").doc(key+"_notification").set({recipientId:state.user.uid,title:"Renewal reminder",body:"Policy "+(p.policyNumber||"")+" reaches "+stage+" reminder stage.",type:"renewal",organizationId:state.workspace.type==="organization"?state.workspace.id:null,createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false},{merge:true});
      current.push({...renewalData,stage});
    }
    state.cache.clear();
  }

  function renewalRiskList(policies,renewals){
    const items=(policies||[]).map(function(p){
      const d=p.expiryDate?p.expiryDate?.toDate?p.expiryDate.toDate():new Date(p.expiryDate):null;
      if(!d||Number.isNaN(d.getTime()))return null;
      const days=Math.ceil((d.getTime()-Date.now())/86400000);
      return {policy:p,days};
    }).filter(Boolean).filter(function(x){return x.days<=90;}).sort(function(a,b){return a.days-b.days;}).slice(0,6);
    if(!items.length)return '<div class="empty">🔄<br>'+esc(t('empty'))+'</div>';
    return '<div class="list">'+items.map(function(x){
      const level=x.days<=7?'danger':x.days<=30?'warn':'success';

    }).join('')+'</div>';
  }

  function timeline(customer,policies,quotes,renewals,claims,comms,tasks){
    var items=[];
    items.push({date:customer.createdAt,label:"Lead/customer created"});
    policies.forEach(x=>items.push({date:x.startDate,label:"Policy "+(x.policyNumber||"")+" issued"}));
    quotes.forEach(x=>items.push({date:x.createdAt,label:"Quotation "+(x.status||"created")}));
    renewals.forEach(x=>items.push({date:x.expiryDate,label:"Renewal "+(x.stage||"")}));
    claims.forEach(x=>items.push({date:x.lossDate||x.createdAt,label:"Claim "+(x.status||"reported")}));
    comms.forEach(x=>items.push({date:x.createdAt,label:"Communication via "+(x.channel||"")}));
    tasks.forEach(x=>items.push({date:x.dueDate,label:"Task "+(x.title||"")}));
    items.sort(function(a,b){return new Date(b.date||0)-new Date(a.date||0);});
    return '<div class="list">'+items.slice(0,12).map(function(x){return '<div class="list-row"><div><div class="list-title">'+esc(x.label)+
      '</div><div class="list-sub">'+fmtDate(x.date)+'</div></div><span>•</span></div>';}).join("")+'</div>';
  }

  async function edit(viewName,id){
    var def=Domain[viewName];if(!def)return;
    if(!id&&!InsurNex.can(viewName,"write")){toast(t("noPermission"),"error");return;}
    var cached=state.cache.get(def.collection)||[],row=id?(cached.find(function(x){return x.id===id;})||{}):{};
    modal(id?t("edit"):t("add"),formHtml(viewName,row));
    var recordForm=document.getElementById("recordForm");if(!recordForm)return;
    recordForm.onsubmit=async function(e){
      e.preventDefault();if(recordForm.dataset.saving==="1")return;
      var submit=recordForm.querySelector('button[type="submit"]');
      recordForm.dataset.saving="1";if(submit){submit.disabled=true;submit.setAttribute("aria-busy","true");}
      var f=new FormData(recordForm),d={};
      def.fields.forEach(function(x){var v=f.get(x[0]);if(typeof v==="string")v=v.trim();d[x[0]]=x[2]==="number"&&v!==""?Number(v):v;});
      if(def.collection==="customers"&&(!d.fullName||d.fullName.length<2)){
        toast(InsurNex.locale()==="ar"?"يرجى إدخال اسم العميل (حرفان على الأقل).":"Enter the customer name (at least 2 characters).","error");
        recordForm.dataset.saving="0";if(submit){submit.disabled=false;submit.removeAttribute("aria-busy");}return;
      }
      try{
        if(id){
          var existing=row;await db.collection(def.collection).doc(id).update(Object.assign({},d,{updatedAt:firebase.firestore.FieldValue.serverTimestamp()}));
          await InsurNex.writeAudit("update",def.collection,id,{},existing,Object.assign({},existing,d));
          await InsurNex.logActivity("update",def.collection+" / "+id);
        }else{
          var ref=await db.collection(def.collection).add(InsurNex.docPayload(d));
          await InsurNex.writeAudit("create",def.collection,ref.id,{},null,d);
          await InsurNex.logActivity("create",def.collection+" / "+ref.id);
          if(def.collection==="policies"&&Number(d.commissionAmount||0)>0){
            await db.collection("commissions").add(InsurNex.docPayload({
              policyNumber:d.policyNumber,customerName:d.customerName,insurer:d.insurer,brokerName:state.profile?.name||"",
              premium:Number(d.premium||0),commissionRate:Number(d.commissionRate||0),commissionAmount:Number(d.commissionAmount||0),
              paidCommission:0,commissionDate:d.startDate||null,status:"Expected"
            }));
          }
        }
        state.cache.clear();closeModal();toast(t("saved"));await render();
      }catch(err){
        console.error("InsurNex record save failed",{collection:def.collection,code:err&&err.code,error:err});
        toast(friendlyError(err),"error");
        recordForm.dataset.saving="0";if(submit){submit.disabled=false;submit.removeAttribute("aria-busy");}
      }
    };
  }

      '<div class="field"><label>File</label><input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" required></div>'+
      '<div class="field"><label>'+t("type")+'</label><select name="entityType"><option>Customer</option><option>Policy</option><option>Claim</option><option>Quotation</option><option>Company</option></select></div>'+
      '<div class="field"><label>'+t("category")+'</label><input name="category"></div><div class="field"><label>'+t("policyNumber")+'</label><input name="entityId"></div></div>'+
      '<div class="form-actions"><button class="btn" type="button" data-close-modal>'+t("cancel")+'</button><button class="btn btn-primary">'+t("save")+'</button></div></form>');
    document.getElementById("docForm").onsubmit=async function(e){
      e.preventDefault();var f=new FormData(e.currentTarget),file=f.get("file");

        var workspaceId=state.workspace.id||state.user.uid,safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path="documents/"+workspaceId+"/"+Date.now()+"_"+safe;
        var ref=storage.ref(path);await ref.put(file);var url=await ref.getDownloadURL();
        var data=InsurNex.docPayload({name:f.get("name"),entityType:f.get("entityType"),entityId:f.get("entityId"),category:f.get("category"),
          fileName:file.name,mimeType:file.type,size:file.size,storagePath:path,url:url,status:"active"});
        var snap=await db.collection("documents").add(data);await InsurNex.writeAudit("create","documents",snap.id);state.cache.clear();closeModal();toast(t("saved"));render();
      }catch(err){toast(friendlyError(err),"error");}
    };

  async function crossSellSuggestions(customersRows,policies){
    var result=[];
    var lines=["Motor","Medical","Life","Property","Travel","Marine","Engineering","Liability"];
    customersRows.slice(0,50).forEach(function(c){
      var types=policies.filter(function(p){return p.customerName===c.fullName||p.customerId===c.id;}).map(function(p){return String(p.insuranceType||"");});
      if(!types.length)return;
      var missing=lines.find(function(x){return !types.includes(x);});
      if(missing)result.push({customer:c.fullName,suggestion:missing+" insurance may be a potential cross-sell."});
    });
    return result;
  }

    document.getElementById("companyForm").onsubmit=async function(e){
      e.preventDefault();var btn=document.getElementById("companySubmit");btn.disabled=true;btn.textContent=t("moving");
      try{
        var f=new FormData(e.currentTarget),uid=auth.currentUser.uid,TS=firebase.firestore.FieldValue.serverTimestamp(),name=String(f.get("name")).trim();
        var org=db.collection("organizations").doc(),b=db.batch();

        b.set(db.collection("organizationMembers").doc(org.id+"_"+uid),{organizationId:org.id,organizationName:name,userId:uid,role:"organizationOwner",status:"active",createdAt:TS,updatedAt:TS});
        // additive user update: previous values are preserved
        b.update(db.collection("users").doc(uid),{organizationId:org.id,previousAccountType:p.accountType||"individual_broker",accountType:"brokerage_company",updatedAt:TS});
        await b.commit();
        var moved=0;

    var blob=new Blob(["\ufeff"+out.join("\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=fileName;a.click();URL.revokeObjectURL(url);
  }

  async function enhancedRegister(form){
    // Keep the base auth listener from racing registration after Firebase creates the Auth user.
    registrationInProgress=true;
    window.__INSURNEX_REGISTERING=true;
    const f=new FormData(form);
    const password=String(f.get('password')||''),confirm=String(f.get('confirmPassword')||'');
    const email=String(f.get('email')||'').trim().toLowerCase();
    const type=String(f.get('accountType')||'individual_broker');
    const submit=form.querySelector('.auth-submit');
    try{
      if(!email){const e=new Error('Email is required');e.code='auth/invalid-email';throw e;}
      if(password.length<6){const e=new Error('Password must be at least 6 characters.');e.code='auth/weak-password';throw e;}
      if(password!==confirm){const e=new Error('Passwords do not match.');e.code='auth/password-mismatch';throw e;}
      const terms=form.querySelector('input[name="terms"]');
      if(terms&&!terms.checked){const e=new Error('Terms agreement is required.');e.code='terms-required';throw e;}
      if(submit){submit.disabled=true;submit.innerHTML='<span class="button-spinner"></span>' + tr('register')+'…';}

      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      const c=await auth.createUserWithEmailAndPassword(email,password);
      const uid=c.user.uid,TS=firebase.firestore.FieldValue.serverTimestamp();
      const isOrg=type==='brokerage_office'||type==='brokerage_company';
      const roles=isOrg?['organizationOwner','broker']:type==='manager'?['manager']:type==='customer'?['customer']:['broker'];
      const role=isOrg?'broker_owner':type==='manager'?'manager':type==='customer'?'customer':'broker';
      const fullName=String(f.get('name')||'').trim();
      const phone=String(f.get('mobile')||'').trim();
      const userData={
        uid,email:c.user.email,fullName,name:fullName,phone,mobile:phone,
        country:String(f.get('country')||'').trim(),city:String(f.get('city')||'').trim(),accountType:type,
        role,roles,organizationId:null,photoURL:c.user.photoURL||null,status:'active',emailVerified:!!c.user.emailVerified,
        onboardingCompleted:false,onboardingComplete:false,createdAt:TS,updatedAt:TS
      };
      const batch=db.batch();
      batch.set(db.collection('users').doc(uid),userData,{merge:true});
      batch.set(db.collection('brokerProfiles').doc(uid),{
        userId:uid,licenseNumber:String(f.get('companyLicense')||'').trim(),
        specialization:String(f.get('specialization')||'').trim(),
        companyName:String(f.get('legalName')||'').trim(),
        createdAt:TS,updatedAt:TS
      },{merge:true});
      let createdWorkspace=null;
      if(isOrg){
        const org=db.collection('organizations').doc();
        const orgName=String(f.get('legalName')||f.get('name')||tr('appName')).trim();
        batch.set(org,{
          name:orgName,legalName:orgName,type,ownerId:uid,
          licenseNumber:String(f.get('companyLicense')||'').trim(),
          registrationNumber:String(f.get('registrationNumber')||'').trim(),
          country:String(f.get('country')||'').trim(),city:String(f.get('city')||'').trim(),
          phone,email:c.user.email||'',status:'active',
          address:String(f.get('companyAddress')||'').trim(),website:String(f.get('website')||'').trim(),
          employeeCount:Number(f.get('employees')||0),primaryContact:fullName,
          subscriptionId:null,createdAt:TS,updatedAt:TS
        });
        batch.set(db.collection('organizationMembers').doc(org.id+'_'+uid),{
          organizationId:org.id,organizationName:orgName,userId:uid,role:'organizationOwner',status:'active',
          createdAt:TS,updatedAt:TS
        });
        userData.organizationId=org.id;
        batch.set(db.collection('users').doc(uid),{organizationId:org.id},{merge:true});
        createdWorkspace={type:'organization',id:org.id,name:orgName};
      }
      await batch.commit();
      if(createdWorkspace)IN.setWorkspace(createdWorkspace);
      await IN.loadIdentity();
      await IN.writeAudit('register','users',uid,{accountType:type});
      await IN.logActivity('register','InsurNex account',{accountType:type});
      IN.toast(tr('accountCreated'));
      await enter();
      registrationInProgress=false;
      window.__INSURNEX_REGISTERING=false;
    }catch(err){
      registrationInProgress=false;
      window.__INSURNEX_REGISTERING=false;
      if(submit){submit.disabled=false;submit.innerHTML='<span>'+tr('register')+'</span>';}
      const msg=(err&&err.code==='terms-required')?tr('termsAgreement'):(typeof friendlyError==='function'?friendlyError(err):(err?.message||tr('network')));
      IN.toast(msg,'error');
    }
  }

  function parseCSV(text){
    const rows=[];let row=[],cell='',quote=false;
    for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(quote&&next==='"'){cell+='"';i++;}else quote=!quote;}else if(ch===','&&!quote){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&next==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()))rows.push(row);row=[];}else cell+=ch;}
    row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row);if(!rows.length)return [];
    const headers=rows[0].map(x=>String(x).trim());return rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'').trim()])));
  }
  function detectColumns(rows){
    const headers=rows[0]?Object.keys(rows[0]):[];const choose=(rx)=>headers.find(h=>rx.test(norm(h)));
    return {amount:choose(/amount|cost|expense|spend|value|total|paid|claim/),date:choose(/date|month|period|service.?date/),service:choose(/service|procedure|category|type|diagnosis|provider/)};
  }
  function numeric(v){const n=Number(String(v||'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:0;}
  function buildMedicalReport(rows,customer){
    const c=detectColumns(rows),amounts=rows.map(r=>numeric(r[c.amount])).filter(n=>n>0),total=amounts.reduce((a,b)=>a+b,0),mean=amounts.length?total/amounts.length:0;
    const freq={};rows.forEach(r=>{const k=c.service?String(r[c.service]||'Unknown').trim():'Unknown';freq[k]=(freq[k]||0)+1;});
    const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,7);
    const spendByService={};if(c.service&&c.amount){rows.forEach(r=>{const k=String(r[c.service]||'Unknown').trim();spendByService[k]=(spendByService[k]||0)+numeric(r[c.amount]);});}

  async function analyzeMedicalFile(customerId,file){

      const wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=window.XLSX.utils.sheet_to_json(ws,{defval:''});report=buildMedicalReport(rows,customer);
    }

  async function customerContext(id){
    const customers=await IN.queryDocs('customers');const customer=customers.find(c=>c.id===id);if(!customer)return null;
    const [policies,renewals,claims,quotes,comms,tasks]=await Promise.all(['policies','renewals','claims','quotations','communications','tasks'].map(c=>IN.queryDocs(c)));
    const match=r=>r.customerId===id||norm(r.customerName)===norm(customer.fullName||customer.name);
    const ps=policies.filter(match),rs=renewals.filter(match),cs=claims.filter(match),qs=quotes.filter(match),ms=comms.filter(match),ts=tasks.filter(match);
    const recentSince=nowMs()-30*86400000,recentInteractions=ms.filter(x=>toMs(x.createdAt)>=recentSince).length+ts.filter(x=>toMs(x.createdAt)>=recentSince).length;
    const expiring=ps.filter(p=>IN.isExpiring(p.expiryDate,45)).length,renewed=rs.filter(x=>['Renewed','renewed'].includes(x.status)).length,renewalBase=rs.length;
    const openClaims=cs.filter(x=>!['Settled','Closed','Rejected'].includes(x.status||'')).length,overdueTasks=ts.filter(x=>norm(x.status)==='overdue'||(toMs(x.dueDate)&&toMs(x.dueDate)<nowMs()&&!['Completed','Closed'].includes(x.status||''))).length;
    const activePolicies=ps.filter(x=>['Active','active','Renewed','renewed'].includes(x.status)).length,premium=ps.reduce((n,x)=>n+Number(x.premium||0),0);
    const engagement=clamp((recentInteractions*12)+(ms.length*2)+(activePolicies*8),0,100);const activity=clamp(recentInteractions*18+ps.length*5+cs.length*4,0,100);
    let renewal=50+(customer.status==='inactive'||customer.status==='lost'?-20:15)+(expiring?15:0)+(renewalBase?Math.min(15,Math.round(renewed/Math.max(1,renewalBase)*15)):0)-(openClaims*5);renewal=clamp(renewal,0,100);
    const allCust=customers.map(c=>({id:c.id,p:policies.filter(p=>p.customerId===c.id||norm(p.customerName)===norm(c.fullName||c.name)).reduce((n,p)=>n+Number(p.premium||0),0)})).sort((a,b)=>a.p-b.p);const pos=allCust.findIndex(x=>x.id===id),valuePct=allCust.length?Math.round((Math.max(0,pos)/(Math.max(1,allCust.length-1)))*100):0;
    const types=new Set(ps.map(p=>String(p.insuranceType||'').toLowerCase())),lines=['Motor','Medical','Life','Property','Travel','Marine','Engineering','Liability'],missing=lines.filter(x=>!types.has(x.toLowerCase())).slice(0,3);
    const attention=[];if(expiring)attention.push(`${expiring} ${tr('expiringSoon')}`);if(openClaims)attention.push(`${openClaims} ${tr('open')}`);if(overdueTasks)attention.push(`${overdueTasks} ${tr('overdue')}`);if(customer.status==='inactive'||customer.status==='lost')attention.push(tr('attentionRequired'));
    return {customer,policies:ps,renewals:rs,claims:cs,quotes:qs,communications:ms,tasks:ts,engagement,activity,renewal,valuePct,missing,attention,premium};
  }

ws="9" id="aiDraftText">${esc(body)}</textarea></div><div class="form-actions"><button class="btn btn-primary" id="aiDraftSave">${esc(tr('draftEmail'))}</button></div>`);document.getElementById('aiDraftSave').onclick=()=>{document.getElementById('emailTo')?.focus();closeModalSafe();go('operations');setTimeout(sendEmailComposer,120);};}}

  function modal(title,body){

  async function audit(action,collection,id,metadata){await IN.writeAudit(action,collection,id,metadata||{});await IN.logActivity(action,collection,{id,...(metadata||{})});}
  async function addDoc(collection,data){const ref=await db.collection(collection).add(stamp(data));await audit('create',collection,ref.id,{});return ref;}
  function refresh(){state.cache.clear();window.dispatchEvent(new HashChangeEvent('hashchange'));}
  function actionButton(action,label,kind='btn'){

  }

  async function convertLead(id){
    if(!canWrite('opportunities'))return;
    const lead=await readDoc('leads',id); if(!lead){IN.toast(t('noRecords'),'error');return;}
    try{
      const ref=await addDoc('opportunities',{
        sourceLeadId:id,customerName:lead.fullName||'',customerId:lead.customerId||null,
        phone:lead.phone||'',email:lead.email||'',insuranceType:lead.insuranceType||'',
        estimatedPremium:Number(lead.estimatedPremium||0),expectedCommission:Number(lead.expectedCommission||0),
        priority:lead.priority||'warm',closingDate:lead.expectedCloseDate||null,
        assignedBrokerName:state.profile?.fullName||state.profile?.name||'',status:'New'
      });
      await db.collection('leads').doc(id).update({stage:'Qualified',convertedOpportunityId:ref.id,updatedAt:FieldValue().serverTimestamp()});
      await audit('convert','leads',id,{to:'opportunities',opportunityId:ref.id});
      IN.toast(L('تم تحويل الـLead إلى فرصة.','Lead converted to an opportunity.')); refresh();
    }catch(e){IN.toast(IN.friendlyError(e),'error');}
  }

  async function createQuoteFromOpportunity(id){
    if(!canWrite('quotations'))return;

      const ref=await addDoc('quotations',{
        opportunityId:id,customerId:opp.customerId||null,customerName:opp.customerName||'',
        product:opp.product||'',insurer:opp.insurer||'',coverage:opp.coverage||'',
        sumInsured:Number(opp.sumInsured||0),premium:Number(opp.estimatedPremium||0),
        commissionAmount:Number(opp.expectedCommission||0),validUntil:'',status:'Draft'
      });
      await db.collection('opportunities').doc(id).update({status:'Quotation',quotationId:ref.id,updatedAt:FieldValue().serverTimestamp()});
      await audit('convert','opportunities',id,{to:'quotations',quotationId:ref.id});
      IN.toast(L('تم إنشاء عرض السعر.','Quotation created.')); refresh();
    }catch(e){IN.toast(IN.friendlyError(e),'error');}
  }

  async function issuePolicyFromQuote(id){
    if(!canWrite('policies'))return;
    const q=await readDoc('quotations',id);if(!q){IN.toast(t('noRecords'),'error');return;}
    const today=new Date(); const start=today.toISOString().slice(0,10); const expiry=new Date(today.getTime()+365*86400000).toISOString().slice(0,10);
    modal(L('إصدار وثيقة من العرض','Issue policy from quotation'),`<form id="wfPolicyForm" class="form-stack"><div class="form-grid">
      <div class="field"><label>${esc(t('policyNumber'))}</label><input name="policyNumber" required></div>
      <div class="field"><label>${esc(t('insurer'))}</label><input name="insurer" value="${esc(q.insurer||'')}"></div>
      <div class="field"><label>${esc(t('product'))}</label><input name="product" value="${esc(q.product||'')}"></div>
      <div class="field"><label>${esc(t('premium'))}</label><input type="number" name="premium" value="${Number(q.premium||0)}"></div>
      <div class="field"><label>${esc(t('startDate'))}</label><input type="date" name="startDate" value="${start}"></div>
      <div class="field"><label>${esc(t('expiryDate'))}</label><input type="date" name="expiryDate" value="${expiry}"></div>
      <div class="field"><label>${esc(t('commission'))}</label><input type="number" step="0.01" name="commissionAmount" value="${Number(q.commissionAmount||0)}"></div>
      <div class="field"><label>${esc(t('paymentStatus'))}</label><select name="paymentStatus"><option>pending</option><option>partial</option><option>paid</option><option>overdue</option></select></div>
    </div><div class="form-actions"><button class="btn" type="button" data-crm-cancel>${esc(t('cancel'))}</button><button class="btn btn-primary">${esc(t('save'))}</button></div></form>`);
    document.getElementById('wfPolicyForm').onsubmit=async e=>{
      e.preventDefault(); const f=new FormData(e.currentTarget),d=Object.fromEntries(f.entries());
      try{
        const ref=await addDoc('policies',{quotationId:id,customerId:q.customerId||null,customerName:q.customerName||'',policyNumber:safe(d.policyNumber),insurer:safe(d.insurer),product:safe(d.product),insuranceType:q.insuranceType||'',coverage:q.coverage||'',sumInsured:Number(q.sumInsured||0),premium:Number(d.premium||0),startDate:d.startDate,expiryDate:d.expiryDate,commissionRate:0,commissionAmount:Number(d.commissionAmount||0),paymentStatus:d.paymentStatus,status:'Active'});
        if(Number(d.commissionAmount||0)>0){await addDoc('commissions',{policyId:ref.id,quotationId:id,policyNumber:d.policyNumber,customerId:q.customerId||null,customerName:q.customerName||'',insurer:d.insurer||q.insurer||'',brokerName:state.profile?.name||'',premium:Number(d.premium||0),commissionRate:0,commissionAmount:Number(d.commissionAmount||0),paidCommission:0,commissionDate:d.startDate,status:'Expected'});}
        await db.collection('quotations').doc(id).update({status:'Accepted',policyId:ref.id,updatedAt:FieldValue().serverTimestamp()});
        await audit('convert','quotations',id,{to:'policies',policyId:ref.id});close();IN.toast(L('تم إصدار الوثيقة وتسجيل العمولة.','Policy issued and commission recorded.'));refresh();
      }catch(err){IN.toast(IN.friendlyError(err),'error');}
    };
    document.querySelector('[data-crm-cancel]')?.addEventListener('click',close,{once:true});
  }

  function renewalStage(expiry){
    const d=new Date(expiry); if(Number.isNaN(d.getTime()))return '30 Days';
    const days=Math.ceil((d.getTime()-Date.now())/86400000);
    if(days<=0)return 'Expired'; if(days<=7)return '7 Days'; if(days<=15)return '15 Days'; if(days<=30)return '30 Days'; if(days<=45)return '45 Days'; if(days<=60)return '60 Days'; return '90 Days';
  }

      await audit('renewal_started','policies',id,{renewalId:ref.id});IN.toast(L('تم بدء رحلة التجديد.','Renewal workflow started.'));refresh();

    modal(w('commissionCalc'),`<form id="wfCommission" class="form-stack"><div class="form-grid">
      <div class="field"><label>${esc(t('customers'))}</label><select name="customerId"><option value="">—</option>${customers.map(c=>`<option value="${esc(c.id)}">${esc(c.fullName||c.name||'')}</option>`).join('')}</select></div>

  async function insurerContacts(id){

  async function sendEmailWorkflow(draft){
    const form=document.getElementById('wfEmail'); if(!form)return;
    const f=new FormData(form),from=safe(f.get('from')),to=safe(f.get('to')),subject=safe(f.get('subject')),message=safe(f.get('message'));
    if(!from){IN.toast(L('أضف بريد الوسيط أولًا.','Add the broker email first.'),'error');return;}if(!to){IN.toast(L('أضف المستلم.','Add a recipient.'),'error');return;}if(!subject){IN.toast(L('أضف عنوانًا للرسالة.','Add a subject.'),'error');return;}
    const files=Array.from(form.querySelector('input[type="file"]')?.files||[]).map(x=>({name:x.name,size:x.size,type:x.type}));
    try{
      const custId=safe(f.get('customerId')),insurerId=safe(f.get('insurerId'));
      if(!draft){
        const verified=!!state.profile?.emailSettings?.verified;
        if(!verified){IN.toast(L('يجب توثيق البريد المرتبط من الخدمة الآمنة قبل الإرسال.','The connected sender must be verified by the secure email service before sending.'),'error');return;}
        if(!window.INSURNEX_AI?.emailFunction||!firebase.functions){IN.toast(L('الإرسال الفعلي يحتاج Backend/Cloud Function.','Actual sending requires a Backend/Cloud Function.'),'error');return;}
        const fn=firebase.functions().httpsCallable(window.INSURNEX_AI.emailFunction);
        await fn({from,to,cc:safe(f.get('cc')),bcc:safe(f.get('bcc')),subject,message,attachments:files,organizationId:state.workspace.id||null,customerId:custId||null,insurerId:insurerId||null});
      }
      await addDoc('communications',{customerId:custId||null,insurerId:insurerId||null,channel:'Email',from,to,cc:safe(f.get('cc')),bcc:safe(f.get('bcc')),subject,message,attachmentMetadata:files,status:draft?'draft':'sent',relatedType:'operations',templateId:safe(f.get('templateId'))});
      close();IN.toast(draft?t('saved'):L('تم الإرسال وتسجيل العملية.','Email sent and logged.'));
      if(location.hash==='#operations')refresh();
    }catch(e){IN.toast(IN.friendlyError(e),'error');}
  }

    const missing=docs.length?[]:[L('المستند المرتبط بالوثيقة','Policy-linked document')];
    const ref=await addDoc('insuranceFileAnalyses',{policyId:id,policyNumber:p.policyNumber||'',status:'backend_required',findings,missing,sourceDocuments:docs.map(x=>x.id)});
    await saveAIAction('policy_file_analysis_request','policies',id,{analysisId:ref.id,findings,missing},'requested');
    modal(L('تحليل ملف الوثيقة','Policy File Analyzer'),
      '<div class="card"><h3>'+esc(p.policyNumber||'Policy')+'</h3><div class="list">'+findings.map(x=>'<div class="list-row"><span>'+esc(x.split(':')[0])+'</span><strong>'+esc(x.split(':').slice(1).join(':').trim()||'—')+'</strong></div>').join('')+'</div></div>'+
      '<div class="card" style="margin-top:12px"><h3>'+esc(L('مراجعات مطلوبة','Review items'))+'</h3><p>'+esc(missing.join(' · ')||L('لا توجد فجوات مستندية واضحة من السجل الحالي.','No obvious document gaps in the current record.'))+'</p></div>'+
      '<div class="section-note" style="margin-top:12px">'+esc(L('الاستخراج الكامل من PDF/Endorsements يحتاج Backend/OCR؛ البيانات الظاهرة هنا مأخوذة من سجل الوثيقة نفسه.','Full PDF/endorsement extraction requires Backend/OCR; the values shown are taken from the policy record itself.'))+'</div>'+
      '<div class="form-actions"><button class="btn btn-primary" type="button" data-crm-cancel>'+esc(t('close'))+'</button></div>');
  }

  async function openInsuranceAssessment(id){
    if(!canWrite('insuranceAssessments'))return;
    const c=await readDoc('customers',id);if(!c){IN.toast(t('noRecords'),'error');return;}
    const [policies,claims,renewals,docs]=await Promise.all(['policies','claims','renewals','documents'].map(async col=>{
      const rows=await IN.queryDocs(col);return rows.filter(x=>x.customerId===id||x.customerName===(c.fullName||c.name||''));
    }));
    const lines=['Medical','Motor','Life','Property','Personal Accident','Travel','Marine','Engineering','Liability'];
    const types=policies.map(x=>safe(x.insuranceType||x.product||'').toLowerCase());
    const covered=lines.filter(x=>types.some(t=>t.indexOf(x.toLowerCase())>=0));
    const gaps=lines.filter(x=>!covered.includes(x)).slice(0,5);
    const expiring=policies.filter(x=>IN.isExpiring(x.expiryDate,45)).length;
    const openClaims=claims.filter(x=>!['Settled','Closed','Rejected'].includes(x.status)).length;
    const score=Math.max(0,Math.min(100,100-(gaps.length*10)-(expiring*4)-(openClaims*3)));
    const renewalRisk=expiring>=2?'Elevated':expiring===1?'Moderate':'Low';
    const assessment={
      customerId:id,customerName:c.fullName||c.name||'',score,coveredLines:covered,gaps,
      renewalRisk,activePolicies:policies.filter(x=>['Active','active','Renewed'].includes(x.status)).length,
      expiringPolicies:expiring,openClaims,documentCount:docs.length,
      status:'completed',method:'rules-based',createdBy:auth.currentUser.uid
    };
    const ref=await addDoc('insuranceAssessments',assessment);
    await audit('insurance_assessment','customers',id,{assessmentId:ref.id,score,gaps:gaps.length});
    await saveAIAction('insurance_portfolio_assessment','customers',id,{score,gaps,renewalRisk},'completed');
    modal(L('تقييم الملف التأميني','Insurance Portfolio Assessment'),
      '<div class="grid grid-2">'+
      '<div class="card"><div class="eyebrow">Insurance Profile Score</div><div class="master-score">'+score+'/100</div><div class="master-note">'+esc(L('مؤشر مشتق من الوثائق والمطالبات والتجديدات الحالية.','Derived from current policies, claims and renewals.'))+'</div></div>'+
      '<div class="card"><div class="eyebrow">'+esc(t('renewalRisk'))+'</div><div class="list-title">'+esc(renewalRisk)+'</div><div class="list-sub">'+esc(L(String(expiring)+' وثيقة تحتاج متابعة قريبة.',''+expiring+' policy/policies need near-term review.'))+'</div></div></div>'+
      '<div class="card" style="margin-top:12px"><h3>'+esc(L('التغطيات الحالية','Current coverage'))+'</h3><p>'+esc(covered.join(' · ')||'—')+'</p><h3>'+esc(L('فجوات محتملة للمراجعة','Potential gaps for review'))+'</h3><p>'+esc(gaps.join(' · ')||L('لا توجد فجوات واضحة وفق البيانات الحالية.','No clear gaps from the current data.'))+'</p></div>'+
      '<div class="section-note" style="margin-top:12px">'+esc(L('هذه النتيجة للمراجعة التشغيلية فقط ولا تعني أن منتجًا معينًا مناسب للعميل.','This is an operational review aid and does not mean any particular product is suitable.'))+'</div>'+
      '<div class="form-actions"><button type="button" class="btn btn-primary" data-crm-cancel>'+esc(t('close'))+'</button></div>');
  }

  async function openPaymentDialog(id){
    if(!canWrite('payments'))return;
    const p=await readDoc('policies',id);if(!p){IN.toast(t('noRecords'),'error');return;}
    const payments=(await IN.queryDocs('payments')).filter(x=>x.policyId===id||x.policyNumber===p.policyNumber);
    const paid=payments.filter(x=>['paid','partial'].includes(String(x.status||'').toLowerCase())).reduce((n,x)=>n+Number(x.amount||0),0);
    modal(L('تسجيل دفعة','Record Payment'),
      '<form id="wfPayment" class="form-stack"><div class="form-grid">'+
      '<div class="field"><label>'+esc(t('policyNumber'))+'</label><input value="'+esc(p.policyNumber||'')+'" disabled></div>'+
      '<div class="field"><label>'+esc(t('amount'))+'</label><input name="amount" type="number" min="0" step="0.01" required></div>'+
      '<div class="field"><label>'+esc(t('method'))+'</label><select name="method"><option>Bank transfer</option><option>Card</option><option>Online</option><option>Cash</option></select></div>'+
      '<div class="field"><label>'+esc(t('status'))+'</label><select name="status"><option>paid</option><option>partial</option><option>pending</option><option>refunded</option></select></div>'+
      '<div class="field"><label>'+esc(t('date'))+'</label><input name="date" type="date" value="'+new Date().toISOString().slice(0,10)+'" required></div>'+
      '</div><div class="card"><div class="list-row"><span>Premium</span><strong>'+esc(fmtMoney(p.premium||0))+'</strong></div><div class="list-row"><span>Paid to date</span><strong>'+esc(fmtMoney(paid))+'</strong></div></div>'+
      '<div class="form-actions"><button type="button" class="btn" data-crm-cancel>'+esc(t('cancel'))+'</button><button class="btn btn-primary">'+esc(t('save'))+'</button></div></form>');
    document.getElementById('wfPayment').onsubmit=async e=>{
      e.preventDefault();const f=new FormData(e.currentTarget),amount=Number(f.get('amount')||0);
      if(amount<=0){IN.toast(t('amount'),'error');return;}
      try{
        const ref=await addDoc('payments',{policyId:id,policyNumber:p.policyNumber||'',customerId:p.customerId||null,customerName:p.customerName||'',amount,date:f.get('date'),method:f.get('method'),status:f.get('status')});
        await addDoc('financialTransactions',{type:'payment',direction:'in',source:'policy_payment',paymentId:ref.id,policyId:id,policyNumber:p.policyNumber||'',amount,date:f.get('date'),status:f.get('status')});
        const totalPaid=paid+amount,premium=Number(p.premium||0);
        const paymentStatus=totalPaid>=premium&&premium>0?'paid':totalPaid>0?'partial':'pending';
        await db.collection('policies').doc(id).update({paymentStatus,updatedAt:FieldValue().serverTimestamp()});
        await audit('payment_recorded','policies',id,{paymentId:ref.id,amount,paymentStatus});
        close();IN.toast(t('saved'));refresh();
      }catch(err){IN.toast(IN.friendlyError(err),'error');}
    };
  }

  async function renewalCommunication(id,channel){
    const r=await readDoc('renewals',id);if(!r)return;
    const ctx={customerName:r.customerName||'',policyNumber:r.policyNumber||'',insurer:r.insurer||'',renewalDate:r.expiryDate||''};
    if(channel==='Email'){
      if(typeof openEmailComposer==='function')return openEmailComposer(ctx);
    }
    if(!canWrite('communications'))return;
    const subject=L('متابعة تجديد الوثيقة '+ctx.policyNumber,'Renewal follow-up '+ctx.policyNumber);
    const message=L('مرحبًا '+ctx.customerName+'، هذه مسودة متابعة لتجديد الوثيقة '+ctx.policyNumber+' قبل '+ctx.renewalDate+'.','Hello '+ctx.customerName+', this is a renewal follow-up draft for policy '+ctx.policyNumber+' before '+ctx.renewalDate+'.');
    await addDoc('communications',{customerId:r.customerId||null,customerName:ctx.customerName,channel,subject,message,relatedType:'renewal',relatedId:id,status:'draft'});
    await audit('communication_draft','renewals',id,{channel});
    IN.toast(L('تم حفظ مسودة الرسالة.','Communication draft saved.'));
  }

  async function claimAssistant(id){
    const c=await readDoc('claims',id);if(!c)return;
    const docs=(await IN.queryDocs('documents')).filter(x=>x.entityId===id||x.entityId===c.claimNumber);
    const missing=[];
    if(!c.policyNumber)missing.push(L('رقم الوثيقة','Policy number'));
    if(!c.dateOfLoss)missing.push(L('تاريخ الخسارة','Date of loss'));
    if(!c.amount)missing.push(L('مبلغ المطالبة','Claim amount'));
    if(!docs.length)missing.push(L('مستندات المطالبة','Claim documents'));
    const summary={claimNumber:c.claimNumber||'',status:c.status||'',customerName:c.customerName||'',policyNumber:c.policyNumber||'',amount:Number(c.amount||0),missing};
    await saveAIAction('claim_assistant','claims',id,summary,'completed');
    modal(L('مساعد المطالبة','Claim Assistant'),
      '<div class="grid grid-2"><div class="card"><div class="eyebrow">Claim Summary</div><div class="list"><div class="list-row"><span>Claim</span><strong>'+esc(summary.claimNumber||'—')+'</strong></div><div class="list-row"><span>Status</span><strong>'+esc(summary.status||'—')+'</strong></div><div class="list-row"><span>Customer</span><strong>'+esc(summary.customerName||'—')+'</strong></div></div></div>'+
      '<div class="card"><div class="eyebrow">'+esc(L('الإجراء التالي','Next required action'))+'</div><div class="list-title">'+esc(missing.length?missing[0]:L('مراجعة المطالبة والمستندات ثم متابعة الحالة.','Review the claim and documents, then follow the current status.'))+'</div><div class="list-sub">'+esc(L('عناصر يجب مراجعتها','Items to review'))+'</div></div></div>'+
      '<div class="card" style="margin-top:12px"><h3>'+esc(L('المستندات/البيانات الناقصة','Missing information'))+'</h3><p>'+esc(missing.join(' · ')||L('لا توجد عناصر ناقصة واضحة من البيانات الحالية.','No obvious missing items from the current data.'))+'</p></div>'+
      '<div class="section-note" style="margin-top:12px">'+esc(L('المساعد يلخص البيانات المتاحة ولا يتخذ قرار قبول أو رفض المطالبة.','The assistant summarizes available data and does not decide claim approval or rejection.'))+'</div>'+
      '<div class="form-actions"><button type="button" class="btn btn-primary" data-crm-cancel>'+esc(t('close'))+'</button></div>');
  }

  async function requestInsuranceFileAnalysis(id){
    if(!canWrite('insuranceFileAnalyses'))return;
    const d=await readDoc('documents',id);if(!d)return;
    const ref=await addDoc('insuranceFileAnalyses',{documentId:id,entityType:d.entityType||'',entityId:d.entityId||null,fileName:d.fileName||d.name||'',mimeType:d.mimeType||'',status:'backend_required',requestedAt:firebase.firestore.FieldValue.serverTimestamp()});
    await saveAIAction('insurance_file_analysis_request','documents',id,{analysisId:ref.id,status:'backend_required'},'requested');
    modal(L('تحليل ملف التأمين','Insurance File Analyzer'),
      '<div class="card"><div class="eyebrow">'+esc(d.fileName||d.name||'Document')+'</div><h3>'+esc(L('تم إنشاء طلب التحليل','Analysis request created'))+'</h3><p>'+esc(L('الملف محفوظ وآمن، والنتيجة الذكية الكاملة تحتاج Backend/OCR متصلًا. لم يتم اختلاق أي استخراج أو قراءة غير متاحة.','The file is stored securely. Full AI/OCR extraction requires a connected backend. No unavailable extraction was fabricated.'))+'</p><div class="list"><div class="list-row"><span>Status</span><strong>backend_required</strong></div><div class="list-row"><span>Request ID</span><strong>'+esc(ref.id)+'</strong></div></div></div><div class="form-actions"><button class="btn btn-primary" type="button" data-crm-cancel>'+esc(t('close'))+'</button></div>');
  }

  async function requestDocumentExtraction(id){
    if(!canWrite('documentExtractions'))return;
    const d=await readDoc('documents',id);if(!d)return;
    const ref=await addDoc('documentExtractions',{documentId:id,fileName:d.fileName||d.name||'',mimeType:d.mimeType||'',status:'backend_required',requestedAt:firebase.firestore.FieldValue.serverTimestamp()});
    modal(L('استخراج بيانات المستند','Document Extraction'),
      '<div class="card"><h3>'+esc(L('طلب الاستخراج محفوظ','Extraction request saved'))+'</h3><p>'+esc(L('القراءة الآلية الكاملة للـPDF/الصور تحتاج خدمة Backend/OCR.','Full PDF/image extraction requires a Backend/OCR service.'))+'</p><div class="list-row"><span>Status</span><strong>backend_required</strong></div><div class="list-row"><span>Request ID</span><strong>'+esc(ref.id)+'</strong></div></div><div class="form-actions"><button class="btn btn-primary" type="button" data-crm-cancel>'+esc(t('close'))+'</button></div>');
  }

  async function compareInsurerOptions(){
    const products=await IN.queryDocs('insuranceProducts');
    const insurers=await IN.queryDocs('insurers');
    const names=insurers.map(x=>x.name).filter(Boolean);
    const rows=products.filter(x=>!names.length||names.includes(x.insurer)).slice(0,30);
    const grouped={};
    rows.forEach(x=>{const k=x.insuranceType||'Other';(grouped[k]||(grouped[k]=[])).push(x);});
    const html=Object.keys(grouped).map(type=>{
      const items=grouped[type];
      return '<div class="card" style="margin-top:10px"><h3>'+esc(type)+'</h3><div class="list">'+items.map(x=>'<div class="list-row"><div><div class="list-title">'+esc(x.name||'—')+'</div><div class="list-sub">'+esc(x.insurer||'—')+' · '+esc(x.premiumRange||'')+'</div></div><span class="badge">'+esc(String(x.commission??'—'))+'</span></div>').join('')+'</div></div>';
    }).join('');
    await addDoc('insuranceComparisons',{criteria:'available insurer products',productCount:rows.length,status:'completed',method:'data-comparison'});
    modal(L('مقارنة شركات ومنتجات التأمين','Insurer & Product Comparison'),
      '<div class="section-note">'+esc(L('المقارنة تعرض البيانات المتاحة فقط ولا تختار شركة أو منتجًا بدلًا من الوسيط.','The comparison presents available data only and does not choose an insurer or product for the broker.'))+'</div>'+
      (html||'<div class="card empty">'+esc(t('empty'))+'</div>')+
      '<div class="form-actions"><button class="btn btn-primary" type="button" data-crm-cancel>'+esc(t('close'))+'</button></div>');
  }

  async function addHeaderFinanceAction(){
    const route=(location.hash||'#home').slice(1);
    if(route==='insuranceProducts')addHeaderAction('compare-insurers',L('مقارنة الخيارات','Compare options'));
    if(route==='expenses')addHeaderAction('new-expense',L('مصروف جديد','New expense'));
  }

  async function handleAction(action){
    if(action==='commission-calculator'){return openCommissionCalculator();}
    if(action==='new-operation'){return operationComposer();}
    if(action==='mark-notifications-read'){return markAllNotificationsRead();}
    if(action==='email-templates'){location.hash='#email-templates';return;}
    if(action==='new-template'){return editTemplate(null);}
    if(action.startsWith('edit-template:')){return editTemplate(action.split(':')[1]);}
    if(action.startsWith('delete-template:')){return deleteTemplate(action.split(':')[1]);}
    if(action.startsWith('duplicate-template:')){const x=profileTemplates().find(v=>v.id===action.split(':')[1]);if(!x)return;return editTemplate(null,{...x,id:null,name:(x.name||'Template')+' Copy'});}
    if(action.startsWith('use-template:')){return openEmailComposer({templateId:action.split(':')[1]});}
    if(action==='compare-insurers')return compareInsurerOptions();
    if(action==='new-expense'){location.hash='#expenses';return setTimeout(()=>document.querySelector('[data-add="expenses"]')?.click(),40);}
    if(action.startsWith('customer-assessment:'))return openInsuranceAssessment(action.split(':')[1]);
    if(action.startsWith('lead-needs-analysis:'))return openLeadNeedsAnalysis(action.split(':')[1]);
    if(action.startsWith('convert-lead:'))return convertLead(action.split(':')[1]);
    if(action.startsWith('convert-opportunity:'))return createQuoteFromOpportunity(action.split(':')[1]);
    if(action.startsWith('issue-quote:'))return issuePolicyFromQuote(action.split(':')[1]);
    if(action.startsWith('renew-policy:'))return startRenewal(action.split(':')[1]);
    if(action.startsWith('renewal-task:'))return renewalFollowUp(action.split(':')[1]);
    if(action.startsWith('claim-task:'))return claimFollowUp(action.split(':')[1]);
    if(action.startsWith('claim-ai:'))return claimAssistant(action.split(':')[1]);
    if(action.startsWith('policy-payment:'))return openPaymentDialog(action.split(':')[1]);
    if(action.startsWith('renewal-whatsapp:'))return renewalCommunication(action.split(':')[1],'WhatsApp');
    if(action.startsWith('renewal-email:'))return renewalCommunication(action.split(':')[1],'Email');
    if(action.startsWith('policy-file-ai:'))return openPolicyIntelligence(action.split(':')[1]);
    if(action.startsWith('document-extract:'))return requestDocumentExtraction(action.split(':')[1]);
    if(action.startsWith('document-analyze:'))return requestInsuranceFileAnalysis(action.split(':')[1]);
    if(action.startsWith('quote-followup:'))return quoteFollowUp(action.split(':')[1]);
    if(action.startsWith('insurer-contacts:'))return insurerContacts(action.split(':')[1]);
    if(action.startsWith('insurer-email:')){const id=action.split(':')[1],ins=await readDoc('insurers',id),to=Array.isArray(ins?.emailContacts)&&ins.emailContacts[0]?.email||ins?.email||'';return openEmailComposer({to});}
    if(action==='save-email-draft')return sendEmailWorkflow(true);
  }

  document.addEventListener('click',e=>{
    const b=e.target.closest?.('[data-crm-action]');if(!b)return;
    const action=b.dataset.crmAction; if(action==='save-email-draft')return;
    e.preventDefault();e.stopImmediatePropagation();handleAction(action).catch(err=>IN.toast(IN.friendlyError(err),'error'));
  },true);
  document.addEventListener('click',e=>{
    const b=e.target.closest?.('[data-crm-cancel]');if(b){e.preventDefault();close();}
  },true);
  document.addEventListener('click',async e=>{
    const b=e.target.closest?.('[data-crm-doc-delete]');if(!b)return;
    const card=b.closest('.card');try{const rows=await IN.queryDocs('documents'),a=card?.querySelector('a[href]'),row=rows.find(x=>x.url===a?.href||x.url===a?.getAttribute('href'));if(!row)return;if(!confirm(t('delete')+'?'))return;if(row.storagePath){try{await storage.ref(row.storagePath).delete();}catch(_){} }await db.collection('documents').doc(row.id).delete();await audit('delete','documents',row.id,{});state.cache.clear();IN.toast(t('deleted'));refresh();}catch(err){IN.toast(IN.friendlyError(err),'error');}
  },true);
  document.addEventListener('click',e=>{
    const a=e.target.closest?.('[data-master-route="operations"]'); if(a) setTimeout(()=>{},0);
  },true);
  window.addEventListener('hashchange',()=>setTimeout(()=>decorate().catch(()=>{}),100));
  const mo=new MutationObserver(()=>{if(document.getElementById('view'))setTimeout(()=>decorate().catch(()=>{}),20);});
  mo.observe(document.body,{childList:true,subtree:true});
  setTimeout(()=>decorate().catch(()=>{}),200);
})();

</script></body></html>
