/* Top bar */
.app-topbar{
  background:var(--gradient-navy);
  padding:calc(16px + var(--safe-area-top)) 16px 15px;
  box-shadow:0 10px 24px rgba(14,42,92,.16);
}
.brand-mark{
  width:40px;height:40px;border-radius:13px;background:#fff;
  box-shadow:0 7px 16px rgba(0,0,0,.12);
  border:1px solid rgba(255,255,255,.45);
}
.icon-btn{
  width:34px;height:34px;border-radius:11px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.09);
}
.notification-btn i{
  background:var(--gold);
  box-shadow:0 0 0 3px rgba(242,189,99,.18);
}

/* Page headers */
.page-head{
  padding:18px 16px 14px;
  background:var(--card);
  border-bottom:1px solid var(--line);
}
.page-head h1,.page-head h3{color:var(--navy)}
.eyebrow,.section-caption{color:var(--gold)}

/* Cards / dashboard */
.card,.stat,.home-quick-card,.mobile-record-card{
  background:var(--gradient-card);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.card{border-radius:18px;padding:14px}
.stat{border-radius:16px}
.home-quick-card{border-radius:18px}
.home-quick-card:hover,.card:hover{
  box-shadow:var(--shadow-lg);
}
.hero{
  background:radial-gradient(circle at 90% -20%,rgba(242,189,99,.24),transparent 35%),var(--gradient-navy);
  border-radius:22px;
  box-shadow:0 12px 30px rgba(14,42,92,.18);
}
.qicon.navy{background:#E7EFFA;color:var(--navy)}
.qicon.blue{background:#E3F0FF;color:#1A6BC4}
.qicon.purple{background:var(--purple-light);color:var(--purple)}
.qicon.gold{background:var(--gold-soft);color:#8A6D1B}
.qicon.red{background:var(--red-light);color:var(--red)}
.qicon.green{background:var(--green-light);color:var(--green)}

/* Buttons */
.btn{
  border-radius:var(--radius-md);
  transition:all var(--transition);
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:var(--gradient-navy);
  box-shadow:0 8px 18px rgba(14,42,92,.18);
}
.btn-secondary,.btn-accent{
  background:var(--gradient-gold);
  color:var(--navy);
  box-shadow:0 8px 18px rgba(242,189,99,.25);
}
.btn-outline{
  background:var(--card);
  border:1.5px solid var(--line);
}
.btn-outline:hover{border-color:var(--gold)}
.btn-danger{background:var(--red)}

/* Forms */
.field input,.field select,.field textarea{
  border-radius:var(--radius-sm);
  background:#F9FBFE;
  transition:all var(--transition);
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 4px rgba(242,189,99,.15);
  background:var(--card);
}
html[data-theme="dark"] .field input,
html[data-theme="dark"] .field select,
html[data-theme="dark"] .field textarea{
  background:#1A2236;color:var(--slate);border-color:var(--line);
}

/* Auth */
.auth-screen{
  background:radial-gradient(circle at 88% -18%,rgba(242,189,99,.22),transparent 34%),
             linear-gradient(180deg,var(--navy) 0 38%,var(--paper) 38% 100%);
}
.auth-hero{color:#fff}
.auth-kicker,.section-caption{color:var(--gold)}
.auth-panel{
  background:var(--card);
  border:1px solid rgba(14,42,92,.08);
  border-radius:28px;
  box-shadow:var(--shadow-xl);
}
.auth-mini-mark{
  background:var(--gradient-navy);
  box-shadow:0 8px 18px rgba(14,42,92,.16);
}
.auth-company{
  background:var(--paper);
  border-color:var(--line);
}

/* Bottom navigation */
.bottom-nav{
  background:rgba(255,255,255,.98);
  border-top:1px solid var(--line);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
html[data-theme="dark"] .bottom-nav{background:rgba(10,14,26,.98)}
.bottom-nav button{color:#9BA8B8}
.bottom-nav button.active{color:var(--navy)}
.bottom-nav button.active:after{
  background:var(--gold);
  box-shadow:0 0 10px rgba(242,189,99,.4);
}

/* Drawer / modal */
.drawer,.modal{
  background:rgba(7,29,64,.6);
  backdrop-filter:blur(4px);
}
.drawer-panel,.modal-panel{
  background:var(--paper);
  border-radius:26px 26px 0 0;
  box-shadow:0 -18px 50px rgba(0,0,0,.2);
}
.drawer-workspace{
  background:var(--card);border-color:var(--line);border-radius:16px;
}
.workspace-icon{
  background:var(--gold-soft);color:#8A6D1B;
}
.drawer-link:hover{background:#EEF4FA}
.close{
  background:var(--card);border-color:var(--line);color:var(--slate);
}
.modal-head h3{color:var(--navy)}

/* Badges / states */
.badge.success,.badge.ok{background:var(--green-light);color:var(--green)}
.badge.warn{background:var(--red-light);color:var(--red)}
.badge.gold{background:var(--gold-soft);color:#8A6D1B}
.badge.blue{background:#E3F0FF;color:#1A6BC4}
.badge.purple{background:var(--purple-light);color:var(--purple)}

/* Keep InsurNex functional UI free from Wathiqati's animated icon loops */
.app-icon.animated,.app-icon.bounce,.app-icon.float,.app-icon.spin{
  animation:none!important;
  transform-origin:50% 50%;
}

    const userRef=db.collection("users").doc(u.uid);
    const snap=await userRef.get();
    if(!snap.exists){
      // Safe recovery for an authenticated legacy account with no users/{uid} document.
      // This creates a real profile only; it never creates placeholder business records.
      const now=firebase.firestore.FieldValue.serverTimestamp();
      const fallback={uid:u.uid,email:u.email||"",fullName:u.displayName||"",name:u.displayName||"",phone:"",mobile:"",
        accountType:"individual_broker",role:"broker_owner",roles:["broker"],organizationId:null,photoURL:u.photoURL||null,
        country:"",city:"",status:"active",emailVerified:!!u.emailVerified,onboardingCompleted:false,onboardingComplete:false,
        createdAt:now,updatedAt:now};
      await userRef.set(fallback,{merge:true});
      await db.collection("brokerProfiles").doc(u.uid).set({userId:u.uid,createdAt:now,updatedAt:now},{merge:true});
      state.profile=fallback;
    }else{
      const raw=snap.data()||{};
      const legacyRoles=Array.isArray(raw.roles)?raw.roles:(raw.role?[raw.role]:[]);
      state.profile={...raw,
        uid:raw.uid||u.uid,
        fullName:raw.fullName||raw.name||u.displayName||"",
        name:raw.name||raw.fullName||u.displayName||"",
        phone:raw.phone||raw.mobile||"",
        mobile:raw.mobile||raw.phone||"",
        role:raw.role||(legacyRoles[0]||"broker_owner"),
        roles:legacyRoles.length?legacyRoles:["broker"],
        emailVerified:typeof raw.emailVerified==="boolean"?raw.emailVerified:!!u.emailVerified,
        onboardingCompleted:typeof raw.onboardingCompleted==="boolean"?raw.onboardingCompleted:!!raw.onboardingComplete,
        onboardingComplete:typeof raw.onboardingComplete==="boolean"?raw.onboardingComplete:!!raw.onboardingCompleted
      };
      // Backfill only self-editable profile aliases. Role and organizationId are intentionally
      // not changed here because they are authorization-sensitive fields in Firestore Rules.
      const patch={};
      if(!raw.fullName&&raw.name)patch.fullName=raw.name;
      if(!raw.phone&&raw.mobile)patch.phone=raw.mobile;
      if(typeof raw.onboardingCompleted!=="boolean"&&typeof raw.onboardingComplete==="boolean")patch.onboardingCompleted=raw.onboardingComplete;
      if(typeof raw.emailVerified!=="boolean")patch.emailVerified=!!u.emailVerified;
      if(Object.keys(patch).length){patch.updatedAt=firebase.firestore.FieldValue.serverTimestamp();await userRef.update(patch);}
    }
    const ms=await db.collection("organizationMembers").where("userId","==",u.uid).limit(30).get();
    state.memberships=ms.docs.map(d=>({id:d.id,...d.data()}));
    const saved=localStorage.getItem("insurnex-workspace");
    if(saved){try{const p=JSON.parse(saved);if(p.type==="organization"&&state.memberships.some(m=>m.organizationId===p.id))state.workspace=p;}catch{}}
    if(state.workspace.id===null&&state.memberships.length===0)state.workspace={type:"personal",id:null,name:t("personalWorkspace")};
    if(state.memberships.length && !state.memberships.some(m=>m.organizationId===state.workspace.id))state.workspace={type:"organization",id:state.memberships[0].organizationId,name:state.memberships[0].organizationName||t("organizationWorkspace")};
    return state.profile;
  }

  function docPayload(data={},workspace=state.workspace){
    const user=auth.currentUser;

    return {

      organizationId:workspace.type==="organization"?workspace.id:null,
      ownerId:user.uid,

  async function queryDocs(collection,workspace=state.workspace,limit=100){
    const key=collection+"|"+workspace.type+"|"+(workspace.id||"personal")+"|"+limit;
    if(state.cache.has(key))return state.cache.get(key);
    let snap;
    if(collection==="insurers"||collection==="insuranceProducts"){
      snap=await db.collection(collection).where("status","==","active").limit(Math.max(1,Math.min(limit,100))).get();
    } else {
      snap=await scopedQuery(collection,workspace,limit).get();
    }
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    rows.sort((a,b)=>{
      const ta=a.createdAt?.toMillis?a.createdAt.toMillis():Date.parse(a.createdAt||"");
      const tb=b.createdAt?.toMillis?b.createdAt.toMillis():Date.parse(b.createdAt||"");
      return (tb||0)-(ta||0);
    });
    state.cache.set(key,rows);
    return rows;
  }

  async function doLogin(f){
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    await auth.signInWithEmailAndPassword(String(f.get("email")).trim(),String(f.get("password")));
    await InsurNex.loadIdentity();
    await enter();
  }

  async function doRegister(f){
    var password=String(f.get("password")||""), confirm=String(f.get("confirmPassword")||"");
    if(password!==confirm){var e=new Error("mismatch");e.code="auth/password-mismatch";throw e;}
    registrationInProgress=true;
    var c=await auth.createUserWithEmailAndPassword(String(f.get("email")).trim(),password);
    var uid=c.user.uid,type=String(f.get("accountType")||"individual_broker"),batch=db.batch();
    var roles=(type==="brokerage_company"||type==="brokerage_office")?["organizationOwner","broker"]:
      type==="manager"?["manager"]:
      type==="customer"?["customer"]:["broker"];
    var fullName=String(f.get("name")||""),phone=String(f.get("mobile")||"");
    var userData={
      uid:uid,email:c.user.email,fullName:fullName,name:fullName,phone:phone,mobile:phone,
      country:String(f.get("country")||""),city:String(f.get("city")||""),accountType:type,
      role:type==="brokerage_company"?"broker_owner":type==="manager"?"manager":type==="customer"?"customer":"broker_owner",
      roles:roles,organizationId:null,photoURL:c.user.photoURL||null,status:"active",emailVerified:!!c.user.emailVerified,
      onboardingCompleted:false,onboardingComplete:false,
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    batch.set(db.collection("brokerProfiles").doc(uid),{
      userId:uid,licenseNumber:String(f.get("companyLicense")||""),specialization:String(f.get("specialization")||""),
      companyName:String(f.get("companyName")||""),createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    var createdWorkspace=null;
    if(type==="brokerage_company"||type==="brokerage_office"){
      var org=db.collection("organizations").doc(),name=String(f.get("name")||f.get("legalName")||"InsurNex Brokerage");
      batch.set(org,{
        name:name,legalName:String(f.get("legalName")||name),type:type,ownerId:uid,licenseNumber:String(f.get("companyLicense")||""),
        registrationNumber:String(f.get("registrationNumber")||""),country:String(f.get("country")||""),
        city:String(f.get("city")||""),phone:phone,email:String(f.get("email")||c.user.email||""),subscriptionId:null,
        address:String(f.get("companyAddress")||""),website:String(f.get("website")||""),
        employeeCount:Number(f.get("employees")||0),primaryContact:fullName,status:"active",
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      batch.set(db.collection("organizationMembers").doc(org.id+"_"+uid),{
        organizationId:org.id,organizationName:name,userId:uid,role:"organizationOwner",status:"active",
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      createdWorkspace={type:"organization",id:org.id,name:name};
      userData.organizationId=org.id;
    }
    batch.set(db.collection("users").doc(uid),userData);
    await batch.commit();
    if(createdWorkspace)InsurNex.setWorkspace(createdWorkspace);
    await InsurNex.loadIdentity();
    toast(t("accountCreated"));
    await enter();
    registrationInProgress=false;
  }

  async function syncRenewalAutomation(policies,existingRenewals){
    function checkpoint(days){
      if(days<=0)return "Expired";
      if(days<=7)return "7 Days";
      if(days<=15)return "15 Days";
      if(days<=30)return "30 Days";
      if(days<=45)return "45 Days";
      if(days<=60)return "60 Days";
      if(days<=90)return "90 Days";
      return null;
    }
    var current=existingRenewals||[];
    for(var i=0;i<policies.length;i++){
      var p=policies[i],expiry=p.expiryDate?new Date(p.expiryDate):null;
      if(!expiry||Number.isNaN(expiry.getTime()))continue;
      var days=Math.ceil((expiry.getTime()-Date.now())/86400000),stage=checkpoint(days);
      if(!stage)continue;
      var exists=current.some(function(r){return (r.policyId===p.id||r.policyNumber===p.policyNumber)&&r.stage===stage;});
      if(exists)continue;

  async function crossSellSuggestions(customersRows,policies){
    var result=[];
    var lines=["Motor","Medical","Life","Property","Travel","Marine","Engineering","Liability"];
    customersRows.slice(0,50).forEach(function(c){
      var types=policies.filter(function(p){return p.customerName===c.fullName||p.customerId===c.id;}).map(function(p){return String(p.insuranceType||"");});
      if(!types.length)return;
      var missing=lines.find(function(x){return !types.includes(x);});
      if(missing)result.push({customer:c.fullName,suggestion:missing+" insurance may be a potential cross-sell."});
    });
    return result;
  }

  function companyWizard(){
    var p=state.profile||{},owned=(state.memberships||[]).some(function(m){return m.role==="organizationOwner";});

    document.getElementById("companyForm").onsubmit=async function(e){

      try{
        var f=new FormData(e.currentTarget),uid=auth.currentUser.uid,TS=firebase.firestore.FieldValue.serverTimestamp(),name=String(f.get("name")).trim();
        var org=db.collection("organizations").doc(),b=db.batch();

        b.set(db.collection("organizationMembers").doc(org.id+"_"+uid),{organizationId:org.id,organizationName:name,userId:uid,role:"organizationOwner",status:"active",createdAt:TS,updatedAt:TS});
        // additive user update: previous values are preserved
        b.update(db.collection("users").doc(uid),{organizationId:org.id,previousAccountType:p.accountType||"individual_broker",accountType:"brokerage_company",updatedAt:TS});
        await b.commit();
        var moved=0;

          for(var i=0;i<MIGRATE_COLLECTIONS.length;i++){

            await mb.commit();
          }
        }
        await InsurNex.writeAudit("create_company","organization",org.id,{movedDocuments:moved,moveRequested:!!f.get("move")});
        await InsurNex.logActivity("company_created",name,{organizationId:org.id,moved:moved});
        InsurNex.setWorkspace({type:"organization",id:org.id,name:name});
        await InsurNex.loadIdentity();closeModal();toast(t("companyCreated")+" ("+moved+")");shell();render();
      }catch(err){btn.disabled=false;btn.textContent=t("save");toast(friendlyError(err),"error");}

  function csvExport(rows,fileName){
    if(!rows.length){toast(t("empty"),"error");return;}
    var keys=Object.keys(rows[0]).filter(function(k){return k!=="id";});
    var out=[keys.join(",")].concat(rows.map(function(r){return keys.map(function(k){var v=r[k];if(v&&v.toDate)v=v.toDate().toISOString();v=String(v==null?"":v).replace(/"/g,'""');return '"'+v+'"';}).join(",");}));
    var blob=new Blob(["\ufeff"+out.join("\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=fileName;a.click();URL.revokeObjectURL(url);
  }

  function parseCSV(text){
    const rows=[];let row=[],cell='',quote=false;
    for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(quote&&next==='"'){cell+='"';i++;}else quote=!quote;}else if(ch===','&&!quote){row.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&next==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()))rows.push(row);row=[];}else cell+=ch;}
    row.push(cell);if(row.some(x=>String(x).trim()))rows.push(row);if(!rows.length)return [];
    const headers=rows[0].map(x=>String(x).trim());return rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,String(r[i]??'').trim()])));
  }
  function detectColumns(rows){
    const headers=rows[0]?Object.keys(rows[0]):[];const choose=(rx)=>headers.find(h=>rx.test(norm(h)));
    return {amount:choose(/amount|cost|expense|spend|value|total|paid|claim/),date:choose(/date|month|period|service.?date/),service:choose(/service|procedure|category|type|diagnosis|provider/)};
  }
  function numeric(v){const n=Number(String(v||'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:0;}
  function buildMedicalReport(rows,customer){
    const c=detectColumns(rows),amounts=rows.map(r=>numeric(r[c.amount])).filter(n=>n>0),total=amounts.reduce((a,b)=>a+b,0),mean=amounts.length?total/amounts.length:0;
    const freq={};rows.forEach(r=>{const k=c.service?String(r[c.service]||'Unknown').trim():'Unknown';freq[k]=(freq[k]||0)+1;});
    const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,7);
    const spendByService={};if(c.service&&c.amount){rows.forEach(r=>{const k=String(r[c.service]||'Unknown').trim();spendByService[k]=(spendByService[k]||0)+numeric(r[c.amount]);});}
    const topSpend=Object.entries(spendByService).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const anomalies=[];if(amounts.length>=5){const sorted=[...amounts].sort((a,b)=>a-b),q1=sorted[Math.floor((sorted.length-1)*.25)],q3=sorted[Math.floor((sorted.length-1)*.75)],iqr=q3-q1,upper=q3+1.5*iqr;rows.forEach((r,i)=>{const n=numeric(r[c.amount]);if(n>upper&&n>0)anomalies.push({index:i+1,amount:n});});}
    let periodText=tr('noRecords');if(c.date){const periods={};rows.forEach(r=>{const d=new Date(r[c.date]);if(!Number.isNaN(d.getTime())){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');periods[k]=(periods[k]||0)+numeric(r[c.amount]);}});const keys=Object.keys(periods).sort();if(keys.length>=2){const a=periods[keys[keys.length-2]],b=periods[keys[keys.length-1]];const change=a?((b-a)/a*100):0;periodText=`${esc(keys[keys.length-2])} → ${esc(keys[keys.length-1])}: ${change>=0?'+':''}${change.toFixed(1)}%`;} }
    return {customerId:customer?.id||null,customerName:customer?.fullName||customer?.name||'',rows:rows.length,totalSpend:total,averageSpend:mean,uniqueServices:Object.keys(freq).length,topFrequency:top,topSpend,periodText,anomalies:anomalies.slice(0,20),columns:c,generatedAt:new Date().toISOString()};
  }

  async function analyzeMedicalFile(customerId,file){
    const customers=await IN.queryDocs('customers');const customer=customers.find(c=>c.id===customerId)||null;
    const max=15*1024*1024;if(!file)return; if(file.size>max){IN.toast(tr('fileTooLarge'),'error');return;}
    let report=null,kind=file.name.toLowerCase().endsWith('.csv')?'csv':(/\.xlsx?$/.test(file.name.toLowerCase())?'excel':'binary');

    }
    const workspaceId=state.workspace.id||state.user.uid;let fileMeta=null;
    try{const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path='medical/'+workspaceId+'/'+Date.now()+'_'+safe,ref=storage.ref(path);await ref.put(file);fileMeta={fileName:file.name,mimeType:file.type,size:file.size,storagePath:path};}catch(e){console.warn('medical upload',e);}
    if(report){
      try{const ref=await db.collection('medicalAnalyses').add(IN.docPayload({customerId,customerName:customer?.fullName||'',sourceFile:fileMeta,analysisType:'statistical-tabular',status:'completed',report}));await IN.writeAudit('medical_analysis','medicalAnalyses',ref.id,{customerId,analysisType:'statistical-tabular'});await IN.logActivity('medical_analysis','Medical consumption analysis',{customerId});IN.toast(tr('analysisSaved'));return {report,local:true,id:ref.id};}

    return {report:null,local:false};
  }

  async function customerContext(id){
    const customers=await IN.queryDocs('customers');const customer=customers.find(c=>c.id===id);if(!customer)return null;
    const [policies,renewals,claims,quotes,comms,tasks]=await Promise.all(['policies','renewals','claims','quotations','communications','tasks'].map(c=>IN.queryDocs(c)));
    const match=r=>r.customerId===id||norm(r.customerName)===norm(customer.fullName||customer.name);
    const ps=policies.filter(match),rs=renewals.filter(match),cs=claims.filter(match),qs=quotes.filter(match),ms=comms.filter(match),ts=tasks.filter(match);
    const recentSince=nowMs()-30*86400000,recentInteractions=ms.filter(x=>toMs(x.createdAt)>=recentSince).length+ts.filter(x=>toMs(x.createdAt)>=recentSince).length;
    const expiring=ps.filter(p=>IN.isExpiring(p.expiryDate,45)).length,renewed=rs.filter(x=>['Renewed','renewed'].includes(x.status)).length,renewalBase=rs.length;
    const openClaims=cs.filter(x=>!['Settled','Closed','Rejected'].includes(x.status||'')).length,overdueTasks=ts.filter(x=>norm(x.status)==='overdue'||(toMs(x.dueDate)&&toMs(x.dueDate)<nowMs()&&!['Completed','Closed'].includes(x.status||''))).length;
    const activePolicies=ps.filter(x=>['Active','active','Renewed','renewed'].includes(x.status)).length,premium=ps.reduce((n,x)=>n+Number(x.premium||0),0);
    const engagement=clamp((recentInteractions*12)+(ms.length*2)+(activePolicies*8),0,100);const activity=clamp(recentInteractions*18+ps.length*5+cs.length*4,0,100);
    let renewal=50+(customer.status==='inactive'||customer.status==='lost'?-20:15)+(expiring?15:0)+(renewalBase?Math.min(15,Math.round(renewed/Math.max(1,renewalBase)*15)):0)-(openClaims*5);renewal=clamp(renewal,0,100);
    const allCust=customers.map(c=>({id:c.id,p:policies.filter(p=>p.customerId===c.id||norm(p.customerName)===norm(c.fullName||c.name)).reduce((n,p)=>n+Number(p.premium||0),0)})).sort((a,b)=>a.p-b.p);const pos=allCust.findIndex(x=>x.id===id),valuePct=allCust.length?Math.round((Math.max(0,pos)/(Math.max(1,allCust.length-1)))*100):0;
    const types=new Set(ps.map(p=>String(p.insuranceType||'').toLowerCase())),lines=['Motor','Medical','Life','Property','Travel','Marine','Engineering','Liability'],missing=lines.filter(x=>!types.has(x.toLowerCase())).slice(0,3);
    const attention=[];if(expiring)attention.push(`${expiring} ${tr('expiringSoon')}`);if(openClaims)attention.push(`${openClaims} ${tr('open')}`);if(overdueTasks)attention.push(`${overdueTasks} ${tr('overdue')}`);if(customer.status==='inactive'||customer.status==='lost')attention.push(tr('attentionRequired'));
    return {customer,policies:ps,renewals:rs,claims:cs,quotes:qs,communications:ms,tasks:ts,engagement,activity,renewal,valuePct,missing,attention,premium};
  }

      <div class="grid grid-2" style="margin-top:12px"><div class="card"><h3>${esc(tr('directory'))}</h3>${insurers.length?`<div class="list">${insurers.slice(0,12).map(i=>`<div class="list-row"><div><div class="list-title">${esc(i.name||'Insurance Company')}</div><div class="list-sub">${esc(i.contactName||'')} · ${esc(i.email||'')} · ${esc(i.phone||'')}</div></div><span class="master-pill success">${esc(i.status||'active')}</span></div>`).join('')}</div>`:`<div class="empty">${esc(tr('noRecords'))}</div>`}</div>
      <div class="card"><h3>${esc(tr('emailHistory'))}</h3>${emailRows.length?`<div class="list">${emailRows.map(r=>`<div class="list-row"><div><div class="list-title">${esc(r.subject||'Email')}</div><div class="list-sub">${esc(r.to||r.recipient||'')} · ${esc(fmtDate(r.createdAt))}</div></div><span class="master-pill ${r.status==='sent'?'success':r.status==='failed'?'danger':'warn'}">${esc(r.status||'draft')}</span></div>`).join('')}</div>`:`<div class="empty">${esc(tr('noRecords'))}</div>`}</div></div>`;
  }

  async function emailSettings(){
    const s=state.profile?.emailSettings||{};
    return `<div class="page-head"><div><div class="eyebrow">✉️ ${esc(tr('emailSettings'))}</div><h1>${esc(tr('emailSettings'))}</h1><div class="muted">${esc(tr('secureBackend'))}</div></div></div>
      <div class="card"><form id="emailSettingsForm" class="form-stack"><div class="form-grid"><div class="field"><label>${esc(tr('brokerEmail'))}</label><input type="email" name="brokerEmail" value="${esc(s.brokerEmail||'')}" required></div><div class="field"><label>${esc(tr('displayName'))}</label><input name="displayName" value="${esc(s.displayName||state.profile?.name||'')}"></div><div class="field"><label>${esc(tr('provider'))}</label><select name="provider"><option>Backend API</option><option>SMTP via Backend</option><option>Gmail API via Backend</option><option>Microsoft Graph via Backend</option></select></div><div class="field"><label>${esc(tr('verification'))}</label><input value="${esc(s.verified?tr('verified'):tr('unverified'))}" disabled></div></div><div class="disabled-note">${esc(tr('secureBackend'))}: ${esc(tr('noBackend'))}</div><div class="form-actions"><button class="btn btn-primary">${esc(tr('saveSettings'))}</button></div></form></div>`;
  }
  async function saveEmailSettings(e){e.preventDefault();const f=new FormData(e.currentTarget),uid=state.user.uid,current=state.profile?.emailSettings||{},d={brokerEmail:String(f.get('brokerEmail')||'').trim(),displayName:String(f.get('displayName')||'').trim(),provider:String(f.get('provider')||''),verified:!!current.verified,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};try{await db.collection('users').doc(uid).set({emailSettings:d},{merge:true});await IN.loadIdentity();await IN.writeAudit('update_email_settings','users',uid,{provider:d.provider});IN.toast(tr('saved'));go('operations');}catch(err){IN.toast(err?.message||tr('network'),'error');}}

  async function sendEmailComposer(){
    const insurers=await IN.queryDocs('insurers'),customers=await IN.queryDocs('customers'),policies=await IN.queryDocs('policies'),s=state.profile?.emailSettings||{};
    openModal(tr('sendEmail'),`<form id="masterEmailForm" class="form-stack"><div class="form-grid">
      <div class="field"><label>${esc(tr('from'))}</label><input name="from" value="${esc(s.brokerEmail||'')}" readonly></div><div class="field"><label>${esc(tr('selectInsurer'))}</label><select id="emailInsurer"><option value="">—</option>${insurers.map(i=>`<option value="${esc(i.id)}">${esc(i.name||'')}</option>`).join('')}</select></div>
      <div class="field"><label>${esc(tr('to'))}</label><input id="emailTo" name="to" type="email"></div><div class="field"><label>${esc(tr('selectCustomer'))}</label><select id="emailCustomer"><option value="">—</option>${customers.map(c=>`<option value="${esc(c.id)}">${esc(c.fullName||c.name||'')}</option>`).join('')}</select></div>
      <div class="field field-full"><label>${esc(tr('subject'))}</label><input name="subject" required></div><div class="field field-full"><label>${esc(tr('message'))}</label><textarea name="message" rows="7" required></textarea></div>
      <div class="field field-full"><label>${esc(tr('attachments'))}</label><input type="file" name="attachments" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx"></div>
    </div><div class="disabled-note">${esc(tr('reviewFirst'))}. ${esc(tr('noBackend'))}</div><div class="form-actions"><button type="button" class="btn" id="saveEmailDraft">${esc(tr('draftEmail'))}</button><button class="btn btn-primary" id="sendEmailConfirm">${esc(tr('sendNow'))}</button></div></form>`);
    const ins=document.getElementById('emailInsurer');ins.onchange=()=>{const x=insurers.find(i=>i.id===ins.value);if(x)document.getElementById('emailTo').value=x.email||'';};
    document.getElementById('emailCustomer').onchange=()=>{const id=document.getElementById('emailCustomer').value,ct=customers.find(c=>c.id===id);if(ct&&!document.querySelector('#masterEmailForm textarea').value)document.querySelector('#masterEmailForm textarea').value=`${tr('customer')}: ${ct.fullName||ct.name||''}\n${tr('policies')}: ${policies.filter(p=>p.customerId===id||norm(p.customerName)===norm(ct.fullName||ct.name)).length}`;};
    document.getElementById('saveEmailDraft').onclick=()=>saveEmailDraft(false);document.getElementById('masterEmailForm').onsubmit=e=>{e.preventDefault();saveEmailDraft(true);};
  }
  async function saveEmailDraft(send){
    const form=document.getElementById('masterEmailForm'),f=new FormData(form),from=String(f.get('from')||'').trim(),to=String(f.get('to')||'').trim(),subject=String(f.get('subject')||'').trim(),message=String(f.get('message')||'');
    if(!from){IN.toast(tr('emailRequired'),'error');return;}if(!to){IN.toast(tr('recipientRequired'),'error');return;}if(!subject){IN.toast(tr('subjectRequired'),'error');return;}
    const files=Array.from(form.querySelector('input[type=file]').files||[]).map(x=>({name:x.name,size:x.size,type:x.type}));
    try{
      if(send){
        const verified=!!state.profile?.emailSettings?.verified;if(!verified){IN.toast(tr('emailVerifyRequired'),'error');return;}
        if(!window.INSURNEX_AI.emailFunction){IN.toast(tr('backendRequired'),'error');return;}
        if(!(window.firebase&&firebase.functions)){IN.toast(tr('backendRequired'),'error');return;}
        const fn=firebase.functions().httpsCallable(window.INSURNEX_AI.emailFunction);await fn({from,to,subject,message,attachments:files,organizationId:state.workspace.id||null});
        await db.collection('communications').add(IN.docPayload({customerId:document.getElementById('emailCustomer')?.value||null,channel:'Email',subject,to,status:'sent',relatedType:'operations',attachmentMetadata:files,messageStored:false}));await IN.writeAudit('send_email','communications',to,{subject,attachmentCount:files.length});await IN.logActivity('send_email',subject,{recipient:to});closeModalSafe();IN.toast(tr('emailSent'));go('operations');return;
      }
      await db.collection('communications').add(IN.docPayload({customerId:document.getElementById('emailCustomer')?.value||null,channel:'Email',subject,to,status:'draft',attachmentMetadata:files,messageStored:false}));await IN.writeAudit('email_draft','communications',subject,{recipient:to,attachmentCount:files.length});IN.toast(tr('draftSaved'));closeModalSafe();go('operations');
    }catch(err){IN.toast(err?.message||tr('network'),'error');}
  }

  async function customMedicalPage(){
    const customers=await IN.queryDocs('customers');
    return `<div class="page-head"><div><div class="eyebrow">🩺 ${esc(tr('medicalAnalysis'))}</div><h1>${esc(tr('medicalReport'))}</h1><div class="muted">${esc(tr('medicalDesc'))}</div></div></div>
      <div class="card"><form id="medicalForm" class="form-stack"><div class="form-grid"><div class="field field-full"><label>${esc(tr('selectCustomer'))}</label><select id="medicalCustomer" name="customerId" required><option value="">—</option>${customers.map(c=>`<option value="${esc(c.id)}">${esc(c.fullName||c.name||'')}</option>`).join('')}</select></div></div><div class="file-drop"><div style="font-size:22px">📎</div><div class="master-note">${esc(tr('tabularOnly'))}</div><input id="medicalFile" type="file" accept=".csv,.xlsx,.xls,.pdf,.jpg,.jpeg,.png" required></div><div class="form-actions"><button class="btn btn-primary">${esc(tr('uploadAndAnalyze'))}</button></div></form></div><div id="medicalResult" style="margin-top:12px"></div>`;
  }
  async function runMedicalForm(e){e.preventDefault();const id=document.getElementById('medicalCustomer')?.value,file=document.getElementById('medicalFile')?.files?.[0],box=document.getElementById('medicalResult');if(!id){IN.toast(tr('selectCustomer'),'error');return;}if(!file){IN.toast(tr('fileRequired'),'error');return;}box.innerHTML='<div class="card">'+tr('loading')+'</div>';try{const res=await analyzeMedicalFile(id,file);box.innerHTML=`<div class="card"><div class="page-head"><div><div class="eyebrow">${esc(tr('medicalReport'))}</div><h3>${esc(res.report?.customerName||'')}</h3></div><span class="master-pill ${res.local?'success':'warn'}">${esc(res.local?tr('localAnalysis'):tr('requested'))}</span></div>${res.report?medicalReportHTML(res.report,true):`<div class="disabled-note">${esc(tr('tabularOnly'))}</div>`}</div>`;}catch(err){box.innerHTML='<div class="error-box">'+esc(err?.message||tr('network'))+'</div>';}}

  async function aiAssistantPage(){
    const customers=await IN.queryDocs('customers');return `<div class="page-head"><div><div class="eyebrow">🤖 ${esc(tr('aiAssistant'))}</div><h1>${esc(tr('aiAssistant'))}</h1><div class="muted">${esc(tr('aiDesc'))}</div></div></div><div class="card"><div class="form-grid"><div class="field"><label>${esc(tr('selectCustomer'))}</label><select id="aiCustomer"><option value="">—</option>${customers.map(c=>`<option value="${esc(c.id)}">${esc(c.fullName||c.name||'')}</option>`).join('')}</select></div></div><div class="master-tool-grid"><button class="master-tool" data-ai-action="summary"><div class="tool-icon">🧠</div><strong>${esc(tr('summarizeCustomer'))}</strong><small>${esc(tr('reviewAI'))}</small></button><button class="master-tool" data-ai-action="renewal"><div class="tool-icon">🔄</div><strong>${esc(tr('renewalIndicator'))}</strong><small>${esc(tr('dataDerived'))}</small></button><button class="master-tool" data-ai-action="followup"><div class="tool-icon">✅</div><strong>${esc(tr('createFollowup'))}</strong><small>${esc(tr('reviewAI'))}</small></button><button class="master-tool" data-ai-action="draft"><div class="tool-icon">✉️</div><strong>${esc(tr('draftFollowup'))}</strong><small>${esc(tr('reviewAI'))}</small></button></div></div><div id="aiResult" style="margin-top:12px"></div>`;
  }
  async function aiAction(action){const id=document.getElementById('aiCustomer')?.value;if(!id){IN.toast(tr('selectCustomer'),'error');return;}const c=await customerContext(id),box=document.getElementById('aiResult');if(!c){box.innerHTML='<div class="card empty">'+esc(tr('noCustomerData'))+'</div>';return;}if(action==='summary'){box.innerHTML=`<div class="card"><h3>${esc(tr('summarizeCustomer'))}</h3><p class="master-note">${esc(c.customer.fullName||'')} · ${c.policies.length} ${esc(tr('policies'))} · ${c.claims.length} ${esc(tr('claims'))} · ${esc(fmtMoney(c.premium))} ${esc(tr('premium'))}. ${c.attention.length?c.attention.map(esc).join(' · '):esc(tr('noRecords'))}</p><div class="disabled-note">${esc(tr('dataDerived'))}</div></div>`;}else if(action==='renewal'){box.innerHTML=`<div class="card"><h3>${esc(tr('renewalIndicator'))}</h3><div class="master-score">${c.renewal}/100</div><p class="master-note">${esc(tr('dataDerived'))}</p></div>`;}else if(action==='followup'){if(!IN.can('tasks','write')){IN.toast(tr('noPermission'),'error');return;}try{const ref=await db.collection('tasks').add(IN.docPayload({title:tr('createFollowup')+' · '+(c.customer.fullName||''),description:c.attention.join(' · ')||tr('reviewAI'),dueDate:new Date().toISOString().slice(0,10),priority:c.attention.length?'high':'medium',status:'To Do',linkedEntityType:'customer',linkedEntityId:id,customerId:id,customerName:c.customer.fullName||''}));await IN.writeAudit('create','tasks',ref.id,{source:'ai-assistant',customerId:id});await IN.logActivity('create_followup','Task',{customerId:id});IN.toast(tr('saved'));}catch(e){IN.toast(e?.message||tr('network'),'error');}}else{const body=`${tr('customer')}: ${c.customer.fullName||''}\n${tr('policies')}: ${c.policies.length}\n${tr('renewals')}: ${c.renewals.length}\n${tr('claims')}: ${c.claims.length}\n${tr('attentionRequired')}: ${c.attention.join(', ')||'—'}`;openModal(tr('draftFollowup'),`<div class="field"><label>${esc(tr('message'))}</label><textarea rows="9" id="aiDraftText">${esc(body)}</textarea></div><div class="form-actions"><button class="btn btn-primary" id="aiDraftSave">${esc(tr('draftEmail'))}</button></div>`);document.getElementById('aiDraftSave').onclick=()=>{document.getElementById('emailTo')?.focus();closeModalSafe();go('operations');setTimeout(sendEmailComposer,120);};}}

  function wireCustomRoot(){
    document.querySelectorAll('[data-master-route]').forEach(b=>{if(b.dataset.masterWired)return;b.dataset.masterWired='1';b.addEventListener('click',e=>{e.preventDefault();const route=b.dataset.masterRoute;document.getElementById('drawer')?.classList.remove('show');go(route);});});
    document.getElementById('operationEmailSettings')?.addEventListener('click',()=>go('email-settings'));
    document.getElementById('opAddTask')?.addEventListener('click',()=>{location.hash='#tasks';setTimeout(()=>document.querySelector('[data-add="tasks"]')?.click(),50);});
    document.getElementById('opUpload')?.addEventListener('click',()=>{location.hash='#documents';setTimeout(()=>document.getElementById('upload')?.click(),50);});
    document.getElementById('opSendEmail')?.addEventListener('click',sendEmailComposer);document.getElementById('opAI')?.addEventListener('click',()=>go('ai-assistant'));
    document.getElementById('emailSettingsForm')?.addEventListener('submit',saveEmailSettings);
    document.getElementById('medicalForm')?.addEventListener('submit',runMedicalForm);
    document.querySelectorAll('[data-ai-action]').forEach(b=>b.addEventListener('click',()=>aiAction(b.dataset.aiAction)));  }

  async function renderCustomRoute(){
    injectCustomNav();const route=(location.hash||'#home').slice(1),root=document.getElementById('view');if(!root)return false;
    let html=null;if(route==='operations')html=await operations();else if(route==='email-settings')html=await emailSettings();else if(route==='medical-ai')html=await customMedicalPage();else if(route==='ai-assistant')html=await aiAssistantPage();else return false;
    root.innerHTML=html;wireCustomRoot();return true;
  }

  async function decorateHome(){try{await customCustomersBehaviorCard();}catch(e){console.warn('home enhancement',e);}}

  async function onHash(){
    setTimeout(async()=>{injectCustomNav();if(await renderCustomRoute())return;await decorateHome();wireCustomRoot();},60);
  }

  document.addEventListener('click',function(e){
    const customerBtn=e.target.closest?.('[data-customer]');if(customerBtn){e.preventDefault();e.stopImmediatePropagation();openCustomerSmart(customerBtn.dataset.customer);return;}
  },true);
  document.addEventListener('submit',function(e){
    const form=e.target;if(form?.id==='authForm'&&document.getElementById('accountType')){e.preventDefault();e.stopImmediatePropagation();enhancedRegister(form);}
  },true);
  window.addEventListener('hashchange',onHash);
  IN.auth.onAuthStateChanged(async user=>{
    if(!user||registrationInProgress||window.__INSURNEX_REGISTERING)return;
    try{await IN.loadIdentity();if(state.profile&&!state.profile.onboardingCompleted)showOnboarding();else{enhancement.onboardingVisible=false;setTimeout(onHash,120);}}catch(e){console.warn('master auth',e);}
  });
  const observer=new MutationObserver(()=>{if(!document.getElementById('authForm'))injectCustomNav();if(document.getElementById('accountType'))authTypeEnhance();});
  observer.observe(document.body,{childList:true,subtree:true});
  setTimeout(()=>{authTypeEnhance();injectCustomNav();if(state.user&&!state.profile?.onboardingCompleted)showOnboarding();else onHash();},100);
})();
</script>


<style id="insurnex-crm-workflow-css">
  #recordForm [aria-busy="true"]{opacity:.75;cursor:wait}
  #recordForm button:disabled{opacity:.65;cursor:wait;transform:none;box-shadow:none}
  #recordForm input:focus-visible,#recordForm select:focus-visible,#recordForm textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .crm-workflow-btn{font-weight:900} .record-card-actions .btn,.actions .btn{white-space:nowrap}
  .crm-workflow-banner{margin:0 14px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:9px;color:var(--muted)}
</style>
<script id="insurnex-crm-workflows">
(function(){
  'use strict';
  if(!window.InsurNex) return;
  const IN=window.InsurNex, db=IN.db, auth=IN.auth, storage=IN.storage, state=IN.state;
  const FieldValue=()=>firebase.firestore.FieldValue;
  const L=(ar,en)=>IN.locale()==='ar'?ar:en;
  const t=IN.t, esc=IN.esc, fmtDate=IN.fmtDate, fmtMoney=IN.fmtMoney;
  const safe=(v)=>String(v??'').trim();
  const norm=(v)=>safe(v).toLowerCase();

  const WF={
    leadToOpp:{ar:'تحويل إلى فرصة',en:'Convert to opportunity'},
    oppToQuote:{ar:'إنشاء عرض سعر',en:'Create quotation'},
    quoteToPolicy:{ar:'إصدار وثيقة',en:'Issue policy'},
    policyRenew:{ar:'بدء التجديد',en:'Start renewal'},
    renewalTask:{ar:'متابعة التجديد',en:'Create follow-up'},
    claimTask:{ar:'متابعة المطالبة',en:'Create follow-up'},
    insurerContacts:{ar:'جهات اتصال الشركة',en:'Company contacts'},
    commissionCalc:{ar:'حاسبة العمولات',en:'Commission calculator'},
    markAllRead:{ar:'تعيين الكل كمقروء',en:'Mark all as read'},
    newOperation:{ar:'عملية جديدة',en:'New operation'},
    emailTemplates:{ar:'قوالب البريد',en:'Email templates'},
    newTemplate:{ar:'قالب جديد',en:'New template'},
    saveTemplate:{ar:'حفظ القالب',en:'Save template'},
    useTemplate:{ar:'استخدام',en:'Use'},
    duplicate:{ar:'تكرار',en:'Duplicate'},
    delete:{ar:'حذف',en:'Delete'}
  };
  const w=tup=>WF[tup]?L(WF[tup].ar,WF[tup].en):t(tup);

  function modal(title,body){
    const el=document.getElementById('modal'); if(!el)return;
    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalBody').innerHTML=body;
    el.classList.add('show');
  }
  function close(){document.getElementById('modal')?.classList.remove('show');}
  function canWrite(module){if(!IN.can(module,'write')){IN.toast(t('noPermission'),'error');return false;}return true;}
  function stamp(data){return IN.docPayload({...data,updatedAt:FieldValue().serverTimestamp()});}
  async function readDoc(collection,id){const s=await db.collection(collection).doc(id).get();return s.exists?{id:s.id,...s.data()}:null;}
  async function audit(action,collection,id,metadata){await IN.writeAudit(action,collection,id,metadata||{});await IN.logActivity(action,collection,{id,...(metadata||{})});}
  async function addDoc(collection,data){const ref=await db.collection(collection).add(stamp(data));await audit('create',collection,ref.id,{});return ref;}
  function refresh(){state.cache.clear();window.dispatchEvent(new HashChangeEvent('hashchange'));}
  function actionButton(action,label,kind='btn'){
    return `<button type="button" class="${kind} btn-sm" data-crm-action="${esc(action)}">${esc(label)}</button>`;
  }
  function addHeaderAction(action,label){
    const root=document.getElementById('view'); const actions=root?.querySelector('.page-head .actions');
    if(!actions||root.querySelector('[data-crm-header-action="'+action+'"]'))return;
    const b=document.createElement('button');b.type='button';b.className='btn btn-primary';b.textContent=label;b.dataset.crmAction=action;b.dataset.crmHeaderAction=action;actions.prepend(b);
  }

  async function convertLead(id){
    if(!canWrite('opportunities'))return;
    const lead=await readDoc('leads',id); if(!lead){IN.toast(t('noRecords'),'error');return;}
    try{
      const ref=await addDoc('opportunities',{
        sourceLeadId:id,customerName:lead.fullName||'',customerId:lead.customerId||null,
        phone:lead.phone||'',email:lead.email||'',insuranceType:lead.insuranceType||'',
        estimatedPremium:Number(lead.estimatedPremium||0),expectedCommission:Number(lead.expectedCommission||0),
        priority:lead.priority||'warm',closingDate:lead.expectedCloseDate||null,
        assignedBrokerName:state.profile?.fullName||state.profile?.name||'',status:'New'
      });
      await db.collection('leads').doc(id).update({stage:'Qualified',convertedOpportunityId:ref.id,updatedAt:FieldValue().serverTimestamp()});
      await audit('convert','leads',id,{to:'opportunities',opportunityId:ref.id});
      IN.toast(L('تم تحويل الـLead إلى فرصة.','Lead converted to an opportunity.')); refresh();
    }catch(e){IN.toast(IN.friendlyError(e),'error');}
  }

  async function createQuoteFromOpportunity(id){
    if(!canWrite('quotations'))return;
    const opp=await readDoc('opportunities',id); if(!opp){IN.toast(t('noRecords'),'error');return;}
    try{
      const ref=await addDoc('quotations',{
        opportunityId:id,customerId:opp.customerId||null,customerName:opp.customerName||'',
        product:opp.product||'',insurer:opp.insurer||'',coverage:opp.coverage||'',
        sumInsured:Number(opp.sumInsured||0),premium:Number(opp.estimatedPremium||0),
        commissionAmount:Number(opp.expectedCommission||0),validUntil:'',status:'Draft'
      });
      await db.collection('opportunities').doc(id).update({status:'Quotation',quotationId:ref.id,updatedAt:FieldValue().serverTimestamp()});
      await audit('convert','opportunities',id,{to:'quotations',quotationId:ref.id});
      IN.toast(L('تم إنشاء عرض السعر.','Quotation created.')); refresh();
    }catch(e){IN.toast(IN.friendlyError(e),'error');}
  }

  async function issuePolicyFromQuote(id){
    if(!canWrite('policies'))return;
    const q=await readDoc('quotations',id);if(!q){IN.toast(t('noRecords'),'error');return;}
    const today=new Date(); const start=today.toISOString().slice(0,10); const expiry=new Date(today.getTime()+365*86400000).toISOString().slice(0,10);
    modal(L('إصدار وثيقة من العرض','Issue policy from quotation'),`<form id="wfPolicyForm" class="form-stack"><div class="form-grid">
      <div class="field"><label>${esc(t('policyNumber'))}</label><input name="policyNumber" required></div>
      <div class="field"><label>${esc(t('insurer'))}</label><input name="insurer" value="${esc(q.insurer||'')}"></div>
      <div class="field"><label>${esc(t('product'))}</label><input name="product" value="${esc(q.product||'')}"></div>
      <div class="field"><label>${esc(t('premium'))}</label><input type="number" name="premium" value="${Number(q.premium||0)}"></div>
      <div class="field"><label>${esc(t('startDate'))}</label><input type="date" name="startDate" value="${start}"></div>
      <div class="field"><label>${esc(t('expiryDate'))}</label><input type="date" name="expiryDate" value="${expiry}"></div>
      <div class="field"><label>${esc(t('commission'))}</label><input type="number" step="0.01" name="commissionAmount" value="${Number(q.commissionAmount||0)}"></div>

  async function sendEmailWorkflow(draft){
    const form=document.getElementById('wfEmail'); if(!form)return;
    const f=new FormData(form),from=safe(f.get('from')),to=safe(f.get('to')),subject=safe(f.get('subject')),message=safe(f.get('message'));
    if(!from){IN.toast(L('أضف بريد الوسيط أولًا.','Add the broker email first.'),'error');return;}if(!to){IN.toast(L('أضف المستلم.','Add a recipient.'),'error');return;}if(!subject){IN.toast(L('أضف عنوانًا للرسالة.','Add a subject.'),'error');return;}
    const files=Array.from(form.querySelector('input[type="file"]')?.files||[]).map(x=>({name:x.name,size:x.size,type:x.type}));
    try{
      const custId=safe(f.get('customerId')),insurerId=safe(f.get('insurerId'));
      if(!draft){
        const verified=!!state.profile?.emailSettings?.verified;
        if(!verified){IN.toast(L('يجب توثيق البريد المرتبط من الخدمة الآمنة قبل الإرسال.','The connected sender must be verified by the secure email service before sending.'),'error');return;}
        if(!window.INSURNEX_AI?.emailFunction||!firebase.functions){IN.toast(L('الإرسال الفعلي يحتاج Backend/Cloud Function.','Actual sending requires a Backend/Cloud Function.'),'error');return;}
        const fn=firebase.functions().httpsCallable(window.INSURNEX_AI.emailFunction);
        await fn({from,to,cc:safe(f.get('cc')),bcc:safe(f.get('bcc')),subject,message,attachments:files,organizationId:state.workspace.id||null,customerId:custId||null,insurerId:insurerId||null});
      }
      await addDoc('communications',{customerId:custId||null,insurerId:insurerId||null,channel:'Email',from,to,cc:safe(f.get('cc')),bcc:safe(f.get('bcc')),subject,message,attachmentMetadata:files,status:draft?'draft':'sent',relatedType:'operations',templateId:safe(f.get('templateId'))});
      close();IN.toast(draft?t('saved'):L('تم الإرسال وتسجيل العملية.','Email sent and logged.'));
      if(location.hash==='#operations')refresh();
    }catch(e){IN.toast(IN.friendlyError(e),'error');}
  }

  }

  async function markAllNotificationsRead(){
    const s=await db.collection('notifications').where('recipientId','==',state.user.uid).limit(100).get();const batch=db.batch();let n=0;s.docs.forEach(d=>{if(d.data().read!==true){batch.update(d.ref,{read:true,readAt:FieldValue().serverTimestamp()});n++;}});if(n)await batch.commit();IN.toast(L('تم تحديث الإشعارات.','Notifications updated.'));refresh();
  }

  async function decorate(){
    const root=document.getElementById('view');if(!root)return;const route=(location.hash||'#home').slice(1);
    if(route==='email-templates'){await templateManager();return;}
    const headerMap={commissions:['commission-calculator',w('commissionCalc')],operations:['new-operation',w('newOperation')],notifications:['mark-notifications-read',w('markAllRead')],['email-settings']:['email-templates',w('emailTemplates')]};
    if(headerMap[route]) addHeaderAction(headerMap[route][0],headerMap[route][1]);
    root.querySelectorAll('[data-edit]').forEach(b=>{
      if(b.dataset.crmDecorated)return;b.dataset.crmDecorated='1';const [module,id]=String(b.dataset.edit).split(':');const holder=b.parentElement;if(!holder||!id)return;
      if(module==='leads')holder.insertAdjacentHTML('beforeend',actionButton('convert-lead:'+id,w('leadToOpp'),'btn btn-secondary'));
      if(module==='opportunities')holder.insertAdjacentHTML('beforeend',actionButton('convert-opportunity:'+id,w('oppToQuote'),'btn btn-secondary'));
      if(module==='quotations')holder.insertAdjacentHTML('beforeend',actionButton('issue-quote:'+id,w('quoteToPolicy'),'btn btn-secondary'));
      if(module==='policies')holder.insertAdjacentHTML('beforeend',actionButton('renew-policy:'+id,w('policyRenew'),'btn btn-secondary'));
      if(module==='renewals')holder.insertAdjacentHTML('beforeend',actionButton('renewal-task:'+id,w('renewalTask'),'btn btn-secondary'));
      if(module==='claims')holder.insertAdjacentHTML('beforeend',actionButton('claim-task:'+id,w('claimTask'),'btn btn-secondary'));
      if(module==='insurers'){holder.insertAdjacentHTML('beforeend',actionButton('insurer-contacts:'+id,w('insurerContacts'),'btn btn-secondary'));holder.insertAdjacentHTML('beforeend',actionButton('insurer-email:'+id,t('email'),'btn btn-secondary'));}
    });
    root.querySelectorAll('[data-crm-action="issue-quote"]')?.forEach(()=>{});
    root.querySelectorAll('a[href]').forEach(a=>{const card=a.closest('.card');if(!card||card.querySelector('[data-crm-doc-delete]'))return;if(route!=='documents')return;const rowButton=document.createElement('button');rowButton.type='button';rowButton.className='btn btn-danger btn-sm';rowButton.textContent=t('delete');rowButton.dataset.crmDocDelete='1';card.querySelector('.actions')?.appendChild(rowButton);});
  }

  async function handleAction(action){
    if(action==='commission-calculator'){return openCommissionCalculator();}
    if(action==='new-operation'){return operationComposer();}
    if(action==='mark-notifications-read'){return markAllNotificationsRead();}
    if(action==='email-templates'){location.hash='#email-templates';return;}
    if(action==='new-template'){return editTemplate(null);}
    if(action.startsWith('edit-template:')){return editTemplate(action.split(':')[1]);}
    if(action.startsWith('delete-template:')){return deleteTemplate(action.split(':')[1]);}
    if(action.startsWith('duplicate-template:')){const x=profileTemplates().find(v=>v.id===action.split(':')[1]);if(!x)return;return editTemplate(null,{...x,id:null,name:(x.name||'Template')+' Copy'});}
    if(action.startsWith('use-template:')){return openEmailComposer({templateId:action.split(':')[1]});}
    if(action.startsWith('convert-lead:'))return convertLead(action.split(':')[1]);
    if(action.startsWith('convert-opportunity:'))return createQuoteFromOpportunity(action.split(':')[1]);
    if(action.startsWith('issue-quote:'))return issuePolicyFromQuote(action.split(':')[1]);
    if(action.startsWith('renew-policy:'))return startRenewal(action.split(':')[1]);
    if(action.startsWith('renewal-task:'))return renewalFollowUp(action.split(':')[1]);
    if(action.startsWith('claim-task:'))return claimFollowUp(action.split(':')[1]);
    if(action.startsWith('insurer-contacts:'))return insurerContacts(action.split(':')[1]);
    if(action.startsWith('insurer-email:')){const id=action.split(':')[1],ins=await readDoc('insurers',id),to=Array.isArray(ins?.emailContacts)&&ins.emailContacts[0]?.email||ins?.email||'';return openEmailComposer({to});}
    if(action==='save-email-draft')return sendEmailWorkflow(true);
  }

  document.addEventListener('click',e=>{
    const b=e.target.closest?.('[data-crm-action]');if(!b)return;
    const action=b.dataset.crmAction; if(action==='save-email-draft')return;
    e.preventDefault();e.stopImmediatePropagation();handleAction(action).catch(err=>IN.toast(IN.friendlyError(err),'error'));
  },true);
  document.addEventListener('click',e=>{
    const b=e.target.closest?.('[data-crm-cancel]');if(b){e.preventDefault();close();}
  },true);
  document.addEventListener('click',async e=>{
    const b=e.target.closest?.('[data-crm-doc-delete]');if(!b)return;
    const card=b.closest('.card');try{const rows=await IN.queryDocs('documents'),a=card?.querySelector('a[href]'),row=rows.find(x=>x.url===a?.href||x.url===a?.getAttribute('href'));if(!row)return;if(!confirm(t('delete')+'?'))return;if(row.storagePath){try{await storage.ref(row.storagePath).delete();}catch(_){} }await db.collection('documents').doc(row.id).delete();await audit('delete','documents',row.id,{});state.cache.clear();IN.toast(t('deleted'));refresh();}catch(err){IN.toast(IN.friendlyError(err),'error');}
  },true);
  document.addEventListener('click',e=>{
    const a=e.target.closest?.('[data-master-route="operations"]'); if(a) setTimeout(()=>{},0);
  },true);
  window.addEventListener('hashchange',()=>setTimeout(()=>decorate().catch(()=>{}),100));
  const mo=new MutationObserver(()=>{if(document.getElementById('view'))setTimeout(()=>decorate().catch(()=>{}),20);});
  mo.observe(document.body,{childList:true,subtree:true});
  setTimeout(()=>decorate().catch(()=>{}),200);
})();

</script>
</body></html>
