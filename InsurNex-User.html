display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-main{min-width:0}.list-title{font-size:13px;font-weight:900}.list-sub{font-size:11px;color:var(--muted);margin-top:2px}.workspace-card{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}.login-split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.section-note{font-size:12px;color:var(--muted);line-height:1.7}.checkbox{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--muted)}@media(min-width:900px){.bottom-nav{display:none}.main{padding-bottom:0}.desktop-drawer{position:sticky;top:0;height:100vh;width:250px;display:block;background:var(--surface);border-inline-end:1px solid var(--line);padding:18px;overflow:auto}.content{padding:24px}.modal{align-items:center}.modal-card{border-radius:24px}.auth-card{padding:34px}}@media(max-width:760px){.grid-2,.grid-3,.grid-4,.form-grid,.stats,.login-split{grid-template-columns:1fr 1fr}.page-head{align-items:stretch;flex-direction:column}.page-head .actions{width:100%}.page-head .actions .btn{flex:1}.content{padding:14px}.card{padding:14px}}@media(max-width:480px){.grid-2,.grid-3,.grid-4,.form-grid,.stats,.login-split{grid-template-columns:1fr}.auth-card{padding:20px}.hero{padding:17px}.hero h2{font-size:21px}}

/* === InsurNex Mobile App UI === */
.insurnex-user{
  --navy:#0a2f66;--navy2:#0a72d8;--gold:#23a4f2;--bg:#edf4fa;--surface:#fff;--surface2:#f5f8fc;
  --text:#10243f;--muted:#6b7d93;--line:#dbe6f1;--blue:#0a72d8;--green:#13865f;
  background:var(--bg);
}
.insurnex-user #app{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.insurnex-user .app-shell{
  width:100%;max-width:430px;height:min(900px,calc(100dvh - 18px));min-height:100dvh;
  margin:9px auto;display:block;position:relative;overflow:hidden;background:var(--surface);
  border-radius:30px;box-shadow:0 24px 80px rgba(12,47,86,.18);border:1px solid rgba(141,170,200,.25)
}
.insurnex-user .desktop-drawer{display:none!important}
.insurnex-user .main{width:100%;height:100%;min-height:0;padding:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;background:linear-gradient(180deg,#fff 0%,#f8fbfe 100%)}
.insurnex-user .main::-webkit-scrollbar{width:0;height:0}
.insurnex-user .topbar{
  position:sticky;top:0;z-index:30;min-height:70px;padding:12px 14px 10px;
  padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid rgba(219,230,241,.85);
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px);box-shadow:0 4px 16px rgba(20,57,91,.04)
}
.insurnex-user .brand{gap:9px;min-width:0}.insurnex-user .brand>div:last-child{min-width:0}
.insurnex-user .brand-name{font-size:14px;font-weight:900;line-height:1.1;white-space:nowrap}
.insurnex-user .subtitle{font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insurnex-user .brand-mark.image-mark{
  flex:none;width:38px;height:38px;border-radius:12px;background-color:#fff;
  background-image:url("../assets/logo.svg");background-repeat:no-repeat;background-position:center 22%;
  background-size:320% auto;border:1px solid #dfe9f3;box-shadow:0 7px 16px rgba(9,91,170,.12)
}
.insurnex-user .actions{gap:6px;flex-wrap:nowrap}.insurnex-user .actions .badge{display:none}
.insurnex-user .actions .btn{
  width:38px;height:38px;min-width:38px;padding:0;border-radius:12px;display:grid;place-items:center;
  font-size:15px;background:#f3f7fb;border:1px solid #e4edf6;color:var(--navy)
}
.insurnex-user .actions #logout{color:#b2433b}.insurnex-user .actions #menu{display:none}
.insurnex-user .content{max-width:none;padding:16px 15px calc(96px + env(safe-area-inset-bottom))}
.insurnex-user .page-head{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.insurnex-user .page-head h1{font-size:21px;line-height:1.2;margin:2px 0 0;font-weight:900}
.insurnex-user .eyebrow{color:#0a72d8;font-size:10px;letter-spacing:.08em}
.insurnex-user .muted{font-size:11px;line-height:1.45}
.insurnex-user .actions .btn.btn-primary,.insurnex-user .page-head .btn.btn-primary{
  background:linear-gradient(135deg,#0a2f66,#0a72d8);border-color:transparent;color:#fff
}
.insurnex-user .btn{
  min-height:42px;padding:10px 13px;border-radius:13px;font-size:11px;font-weight:850;
  background:#fff;border:1px solid #dbe6f1;box-shadow:none
}
.insurnex-user .btn-sm{min-height:36px;padding:8px 10px;border-radius:11px}
.insurnex-user .btn-accent{background:linear-gradient(135deg,#16a9f4,#0a72d8);color:#fff;border:0}
.insurnex-user .btn-ghost{background:#f5f8fc}
.insurnex-user .btn-danger{background:#fff4f2;color:#b2433b;border-color:#f2d5d0}
.insurnex-user .hero{
  margin-bottom:13px!important;padding:17px;border-radius:22px;
  background:linear-gradient(145deg,#082e63 0%,#0a72d8 100%);box-shadow:0 18px 34px rgba(10,96,184,.20)
}
.insurnex-user .hero:after{width:150px;height:150px;background:rgba(70,198,255,.20);top:-60px;inset-inline-end:-50px}
.insurnex-user .hero h2{font-size:20px;line-height:1.25;margin-bottom:6px;position:relative;z-index:1}
.insurnex-user .hero p{font-size:11px;line-height:1.65;position:relative;z-index:1}
.insurnex-user .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.insurnex-user .stat{
  min-height:84px;padding:13px 12px;border-radius:17px;background:#fff;border:1px solid #e2ebf4;
  box-shadow:0 7px 20px rgba(21,61,98,.06)
}
.insurnex-user .stat .value{font-size:22px;line-height:1.1;color:var(--navy)}
.insurnex-user .stat .label{margin-top:5px;font-size:10px;line-height:1.35;color:var(--muted)}
.insurnex-user .grid-2,.insurnex-user .grid-3,.insurnex-user .grid-4{grid-template-columns:1fr!important}
.insurnex-user .card{
  padding:14px;border-radius:18px;box-shadow:0 7px 22px rgba(22,58,92,.055);border:1px solid #e1eaf3
}
.insurnex-user .card h3{font-size:14px}.insurnex-user .list{gap:1px}
.insurnex-user .list-row{min-height:48px;padding:9px 0}.insurnex-user .list-title{font-size:12px}.insurnex-user .list-sub{font-size:10px}
.insurnex-user .badge{font-size:9px;padding:5px 8px}
.insurnex-user .field input,.insurnex-user .field select,.insurnex-user .field textarea{
  min-height:46px;padding:12px;border-radius:13px;background:#fbfdff;border-color:#dce7f2;font-size:12px
}
.insurnex-user .field label{font-size:10px}.insurnex-user .form-grid,.insurnex-user .login-split{grid-template-columns:1fr!important}
.insurnex-user .auth-wrap{width:100%;min-height:100dvh;padding:16px;background:linear-gradient(180deg,#eef6fd,#f9fbfe)}
.insurnex-user .auth-card{width:min(430px,100%);padding:20px;border-radius:26px;box-shadow:0 22px 60px rgba(19,62,100,.12)}
.insurnex-user .auth-logo{justify-content:center;flex-direction:column;text-align:center;gap:9px;margin-bottom:18px}
.insurnex-user .auth-logo .brand-mark.image-mark{width:84px;height:84px;border-radius:22px;background-size:285% auto;background-position:center 21%}
.insurnex-user .auth-logo .brand-name{font-size:23px}.insurnex-user .auth-logo .subtitle{font-size:10px}
.insurnex-user .auth-title{font-size:23px}.insurnex-user .auth-copy{font-size:11px;line-height:1.75}
.insurnex-user .mobile-list{display:none}.insurnex-user .desktop-table-note{display:block}
.insurnex-user .drawer{background:rgba(5,18,31,.42);backdrop-filter:blur(3px)}
.insurnex-user .drawer-panel{
  left:0!important;right:0!important;top:auto!important;bottom:0;width:100%;max-width:430px;
  height:min(78dvh,640px);padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  border-radius:24px 24px 0 0;box-shadow:0 -18px 50px rgba(7,32,58,.22)
}
.insurnex-user .drawer-head{margin-bottom:12px}.insurnex-user .drawer-link{padding:12px;border-radius:13px;font-size:12px}
.insurnex-user .workspace-card{padding:11px;border-radius:13px}.insurnex-user .bottom-nav{
  position:absolute!important;left:0!important;right:0!important;bottom:0!important;display:grid!important;
  grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);border-top:1px solid #dbe6f1;box-shadow:0 -8px 28px rgba(23,58,94,.10);backdrop-filter:blur(20px)
}
.insurnex-user .bottom-nav button{min-height:52px;border-radius:14px;padding:6px 3px;font-size:8.5px;gap:3px;color:#7a8a9f}
.insurnex-user .bottom-nav button.active{background:#edf5fd;color:#0a72d8}
.insurnex-user .bottom-nav .icon{font-size:17px}
.insurnex-user .modal{align-items:flex-end;padding:0;background:rgba(5,18,31,.52)}
.insurnex-user .modal-card{
  width:100%;max-width:430px;max-height:90dvh;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))
}
.insurnex-user .modal-head{padding-bottom:8px;border-bottom:1px solid #e6edf5}
.insurnex-user .toast{bottom:104px;font-size:10px}
.insurnex-user .table-wrap{border-radius:14px}
@media(min-width:700px){
  .insurnex-user .app-shell{min-height:0}
}
@media(max-width:699px){
  .insurnex-user #app{align-items:stretch}
  .insurnex-user .app-shell{min-height:100dvh;height:100dvh;margin:0;border-radius:0;border:0;box-shadow:none}
  .insurnex-user .desktop-table,.insurnex-user .desktop-table-note,.insurnex-user .desktop-table-empty{display:none!important}
  .insurnex-user .mobile-list{display:grid;gap:9px}
  .insurnex-user .record-card{
    padding:13px;border:1px solid #e0e9f3;background:#fff;border-radius:17px;
    box-shadow:0 7px 18px rgba(18,57,94,.05)
  }
  .insurnex-user .record-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .insurnex-user .record-card-title{font-size:13px;font-weight:900;color:var(--navy);line-height:1.35}
  .insurnex-user .record-card-meta{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:5px;color:var(--muted);font-size:9.5px;line-height:1.4}
  .insurnex-user .record-card-meta span+span{position:relative;padding-inline-start:9px}
  .insurnex-user .record-card-meta span+span:before{content:"•";position:absolute;inset-inline-start:0}
  .insurnex-user .record-card-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
  .insurnex-user .record-card-actions .btn{min-width:0;min-height:38px;padding:8px 7px;font-size:9px}
  .insurnex-user .mobile-empty{padding:30px 12px;text-align:center;color:var(--muted);border:1px dashed #ccd9e6;border-radius:16px;background:#fff}
  .insurnex-user .page-head .actions{width:100%}
  .insurnex-user .page-head .actions .btn{flex:1}
}
@media(min-width:700px){
  .insurnex-user .content{padding-bottom:28px}
  .insurnex-user .bottom-nav{display:none!important}
}


/* === InsurNex Brand & Authentication Polish === */
.insurnex-user .brand-mark.image-mark{
  display:grid!important;
  place-items:center!important;
  padding:3px!important;
  background:#fff!important;
  background-image:none!important;
  border:1px solid #d8e6f3!important;
  border-radius:13px!important;
  box-shadow:0 8px 20px rgba(8,66,126,.14)!important;
  overflow:hidden!important;
}
.insurnex-user .brand-mark.image-mark img{
  display:block!important;
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  object-position:center!important;
}
.insurnex-user .auth-wrap{
  position:relative!important;
  isolation:isolate;
  overflow:auto!important;
  background:
    radial-gradient(180px 180px at 88% 6%,rgba(25,160,242,.17),transparent 72%),
    radial-gradient(220px 220px at 8% 88%,rgba(10,114,216,.10),transparent 74%),
    linear-gradient(180deg,#eef7ff 0%,#f8fbff 48%,#eef5fb 100%)!important;
}
.insurnex-user .auth-wrap:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  opacity:.38;
  background-image:
    linear-gradient(rgba(10,114,216,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(10,114,216,.035) 1px,transparent 1px);
  background-size:24px 24px;
}
.insurnex-user .auth-card{
  width:min(420px,calc(100% - 20px))!important;
  margin:0 auto!important;

  function roles(){
    const r=state.profile?.roles||[];
    return Array.isArray(r)?r:[String(r)];

  function hasRole(...wanted){const r=roles();return wanted.some(x=>r.includes(x));}

  function can(module,action="read"){
    if(isPlatformAdmin())return true;
    const r=roles();
    if(action==="read")return true;
    if(["settings","team","subscriptions"].includes(module))return r.some(x=>["organizationOwner","organizationAdmin","manager"].includes(x));
    if(module==="commissions")return r.some(x=>["organizationOwner","organizationAdmin","manager","finance","broker"].includes(x));
    if(module==="claims")return r.some(x=>["organizationOwner","organizationAdmin","manager","broker","claimsOfficer","operations"].includes(x));
    if(module==="policies"||module==="quotations"||module==="opportunities")return r.some(x=>["organizationOwner","organizationAdmin","manager","broker","salesAgent","operations"].includes(x));
    if(module==="customers"||module==="leads")return r.some(x=>["organizationOwner","organizationAdmin","manager","broker","salesAgent","customerService"].includes(x));
    return r.some(x=>["organizationOwner","organizationAdmin","manager","broker","salesAgent","customerService","operations","claimsOfficer","finance"].includes(x));
  }

  async function loadIdentity(){
    const u=auth.currentUser;
    state.user=u;
    if(!u){state.profile=null;state.memberships=[];return null;}
    const snap=await db.collection("users").doc(u.uid).get();
    state.profile=snap.exists?snap.data():{};
    const ms=await db.collection("organizationMembers").where("userId","==",u.uid).limit(30).get();
    state.memberships=ms.docs.map(d=>({id:d.id,...d.data()}));
    const saved=localStorage.getItem("insurnex-workspace");
    if(saved){try{const p=JSON.parse(saved);if(p.type==="organization"&&state.memberships.some(m=>m.organizationId===p.id))state.workspace=p;}catch{}}
    if(state.workspace.id===null&&state.memberships.length===0)state.workspace={type:"personal",id:null,name:t("personalWorkspace")};
    if(state.memberships.length && !state.memberships.some(m=>m.organizationId===state.workspace.id))state.workspace={type:"organization",id:state.memberships[0].organizationId,name:state.memberships[0].organizationName||t("organizationWorkspace")};
    return state.profile;
  }

  function setWorkspace(ws){
    state.workspace=ws;
    localStorage.setItem("insurnex-workspace",JSON.stringify(ws));
    state.cache.clear();
    document.dispatchEvent(new CustomEvent("insurnex:workspace",{detail:ws}));
  }

  function scopedQuery(name,workspace=state.workspace,limit=100){
    let q=db.collection(name);
    if(workspace.type==="organization"&&workspace.id){
      q=q.where("organizationId","==",workspace.id).where("workspaceType","==","organization");
    }else{
      q=q.where("ownerId","==",auth.currentUser.uid).where("workspaceType","==","personal");
    }
    return q.limit(Math.max(1,Math.min(limit,100)));
  }

  function docPayload(data={},workspace=state.workspace){
    const user=auth.currentUser;
    if(!user)throw new Error("Not authenticated");
    return {
      ...data,
      workspaceType:workspace.type,
      organizationId:workspace.type==="organization"?workspace.id:null,
      ownerId:user.uid,
      createdBy:user.uid,
      createdAt:data.createdAt||firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
  }

  async function queryDocs(collection,workspace=state.workspace,limit=100){
    const key=collection+"|"+workspace.type+"|"+(workspace.id||"personal")+"|"+limit;
    if(state.cache.has(key))return state.cache.get(key);
    let snap;
    if(collection==="insurers"||collection==="insuranceProducts"){
      snap=await db.collection(collection).where("status","==","active").limit(Math.max(1,Math.min(limit,100))).get();
    } else {
      snap=await scopedQuery(collection,workspace,limit).get();
    }
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    rows.sort((a,b)=>{
      const ta=a.createdAt?.toMillis?a.createdAt.toMillis():Date.parse(a.createdAt||"");
      const tb=b.createdAt?.toMillis?b.createdAt.toMillis():Date.parse(b.createdAt||"");
      return (tb||0)-(ta||0);
    });
    state.cache.set(key,rows);
    return rows;
  }

    if(!auth.currentUser)return;
    try{
      await db.collection("auditLogs").add({
        action,targetType,targetId,actorId:auth.currentUser.uid,actorEmail:auth.currentUser.email||"",
        organizationId:state.workspace.type==="organization"?state.workspace.id:null,
        metadata,before:before||null,after:after||null,createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(e){console.warn("audit",e);}
  }

  async function logActivity(type,subject,metadata={}){
    try{
      const ref=await db.collection("activities").add(docPayload({
        type,subject,metadata,actorId:auth.currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()
      }));
      return ref.id;
    }catch(e){console.warn("activity",e);return null;}
  }

  function isExpiring(date,days=30){
    if(!date)return false;
    const d=date?.toDate?date.toDate():new Date(date); if(Number.isNaN(d.getTime()))return false;
    const diff=Math.ceil((d.getTime()-Date.now())/86400000);
    return diff>=0&&diff<=days;
  }

<script>(function(){
  document.body.classList.add("insurnex-user");
  var auth=InsurNex.auth, db=InsurNex.db, storage=InsurNex.storage, state=InsurNex.state, Domain=InsurNex.Domain;

  var view=(location.hash||"#home").slice(1), search="";

  var nav=[

    ["quotations","quotations","📑"],["policies","policies","🛡️"],["renewals","renewals","🔄"],["claims","claims","🧾"],

    ["insuranceProducts","insuranceProducts","📦"],["commissions","commissions","💰"],["communications","communications","💬"],
    ["reports","reports","📈"],["analytics","analytics","📊"],["team","team","👨‍👩‍👧‍👦"],["notifications","notifications","🔔"],
    ["subscriptions","subscriptions","💳"],["supportTickets","support","🎧"],["account","account","⚙️"]
  ];
  var shortNav=[["home","home","⌂"],["crm","crm","👥"],["leads","leads","🎯"],["renewals","renewals","🔄"],["account","account","⚙️"]];

  function mark(){return '<div class="brand-mark image-mark" aria-label="InsurNex"><img src="assets/logo-mark.svg" alt="InsurNex" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="logo-fallback" hidden>IN</span></div>';}
  function modal(title,html){
    document.getElementById("modalTitle").textContent=title;
    document.getElementById("modalBody").innerHTML=html;
    document.getElementById("modal").classList.add("show");
  }
  function closeModal(){document.getElementById("modal").classList.remove("show");}
  function navigate(v){view=v;search="";location.hash=v;render();}
  function localLabel(k){return t(k)||k;}

  function accountTypeOptions(){
    return '<option value="individual_broker">'+t("individualBroker")+'</option>'+
      '<option value="brokerage_company">'+t("brokerageCompany")+'</option>'+
      '<option value="broker_employee">'+t("brokerEmployee")+'</option>'+
      '<option value="manager">'+t("manager")+'</option>'+
      '<option value="customer">'+t("customer")+'</option>';
  }

  function authPage(mode,error){
    var login=mode==="login";
    var logo='<div class="auth-logo-mark"><img src="assets/logo.svg" alt="InsurNex" loading="eager" decoding="async" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="auth-logo-fallback" hidden>IN</span></div>';
    var companyFields=!login?(
      '<section id="companyFields" class="auth-company" style="display:none">'+
      '<div class="auth-section-label">'+t("companyInfo")+'</div>'+
      '<div class="form-grid">'+
      '<div class="field"><label>'+t("legalName")+'</label><input name="legalName" autocomplete="organization"></div>'+
      '<div class="field"><label>'+t("registrationNumber")+'</label><input name="registrationNumber"></div>'+
      '<div class="field"><label>'+t("brokerLicense")+'</label><input name="companyLicense"></div>'+
      '<div class="field"><label>'+t("employees")+'</label><input name="employees" type="number" min="1"></div>'+
      '<div class="field field-full"><label>'+t("address")+'</label><input name="companyAddress" autocomplete="street-address"></div>'+
      '<div class="field"><label>'+t("website")+'</label><input name="website" type="url"></div>'+
      '<div class="field"><label>'+t("specialization")+'</label><input name="specialization"></div>'+
      '</div></section>'
    ):'';

    document.getElementById("app").innerHTML=
      '<main class="auth-wrap"><section class="auth-card auth-card-pro">'+
      '<div class="auth-top">'+
        '<div class="auth-brand">'+logo+'<div class="auth-brand-copy"><div class="brand-name">InsurNex</div><div class="subtitle">'+esc(t("tagline"))+'</div></div></div>'+
        '<div class="auth-language"><button id="lang" type="button" class="auth-icon-btn">'+(InsurNex.locale()==="ar"?"EN":"ع")+'</button><button id="firebaseCheck" type="button" class="auth-icon-btn" title="Firebase">●</button></div>'+
      '</div>'+
      '<div class="auth-divider"></div>'+
      '<div class="auth-intro">'+
        '<div class="eyebrow">INSURTECH BROKER OS</div>'+
        '<h1 class="auth-title">'+(login?t("login"):t("register"))+'</h1>'+
        '<p class="auth-copy">إدارة العملاء، الوثائق، عروض الأسعار، التجديدات والمطالبات من مساحة عمل واحدة.</p>'+
      '</div>'+
      (error?'<div class="error-box auth-error">'+esc(error)+'</div>':'')+
      '<form id="authForm" class="form-stack auth-form">'+
      (!login?
        '<div class="form-grid">'+
          '<div class="field"><label>'+t("name")+'</label><input name="name" autocomplete="name" required></div>'+
          '<div class="field"><label>'+t("mobile")+'</label><input name="mobile" type="tel" autocomplete="tel" required></div>'+
          '<div class="field"><label>'+t("country")+'</label><input name="country" value="Egypt" autocomplete="country-name"></div>'+
          '<div class="field"><label>'+t("city")+'</label><input name="city" autocomplete="address-level2"></div>'+
        '</div>':'')+
      '<div class="field"><label>'+t("email")+'</label><input type="email" name="email" autocomplete="email" inputmode="email" required></div>'+
      '<div class="field"><label>'+t("password")+'</label><input type="password" name="password" minlength="6" autocomplete="'+(login?"current-password":"new-password")+'" required></div>'+
      (!login?
        '<div class="field"><label>'+t("confirmPassword")+'</label><input type="password" name="confirmPassword" minlength="6" autocomplete="new-password" required></div>'+
        '<div class="field"><label>'+t("accountType")+'</label><select id="accountType" name="accountType">'+accountTypeOptions()+'</select></div>'+
        companyFields+
        '<label class="checkbox auth-terms"><input type="checkbox" name="terms" required><span>أوافق على شروط الاستخدام وسياسة الخصوصية.</span></label>':'')+
      '<button class="btn btn-primary auth-submit" type="submit">'+(login?t("login"):t("register"))+'</button>'+
      '</form>'+
      '<div class="auth-actions">'+
        '<button id="switchAuth" type="button" class="auth-secondary">'+(login?t("register"):t("login"))+'</button>'+
        (login?'<button id="forgot" type="button" class="auth-link">'+t("forgotPassword")+'</button>':'')+
      '</div>'+
      '<div class="auth-firebase-status" id="firebaseStatus"><span class="status-dot"></span><span>Firebase: جاري الفحص…</span></div>'+
      '<div class="auth-security">'+
        '<span><b>Firebase Auth</b><small>تسجيل الحساب</small></span>'+
        '<span><b>Firestore</b><small>بيانات مساحة العمل</small></span>'+
        '<span><b>'+InsurNex.firebaseProject+'</b><small>Firebase Project</small></span>'+
      '</div>'+
      '</section></main>';

    document.getElementById("switchAuth").onclick=function(){authPage(login?"register":"login");};
    document.getElementById("lang").onclick=function(){InsurNex.setLanguage(InsurNex.locale()==="ar"?"en":"ar");authPage(mode);};
    try{var fs=InsurNex.firebaseStatus(), el=document.getElementById("firebaseStatus"); if(el){var ok=fs.online&&fs.configProject==="insurnex-8a9df"&&fs.appProject==="insurnex-8a9df"; el.className="auth-firebase-status "+(ok?"ok":"warn"); el.innerHTML='<span class="status-dot"></span><span>Firebase · '+esc(fs.appProject||fs.configProject||"غير مهيأ")+' · '+(fs.online?"Online":"Offline")+'</span>';}}catch(_e){}
    document.getElementById("firebaseCheck")?.addEventListener("click",function(){var fs=InsurNex.firebaseStatus();var ok=fs.online&&fs.configProject==="insurnex-8a9df"&&fs.appProject==="insurnex-8a9df";authPage(mode,ok?"Firebase متصل ومهيأ للمشروع insurnex-8a9df.":"Firebase غير مهيأ أو الاتصال بالإنترنت غير متاح.");});
    if(login)document.getElementById("forgot").onclick=forgot;
    if(!login){
      var type=document.getElementById("accountType"),box=document.getElementById("companyFields");
      type.onchange=function(){box.style.display=this.value==="brokerage_company"?"block":"none";};
    }
    document.getElementById("authForm").onsubmit=async function(e){
      e.preventDefault();
      var form=e.currentTarget;
      var submit=form.querySelector(".auth-submit");
      if(submit){submit.disabled=true;submit.textContent=login?"جاري تسجيل الدخول…":"جاري إنشاء الحساب…";}
      try{
        var f=new FormData(form);
        if(login)await doLogin(f);else await doRegister(f);
      }catch(err){
        authPage(mode,friendlyError(err));
      }
    };
  }

  async function doLogin(f){
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    await auth.signInWithEmailAndPassword(String(f.get("email")).trim(),String(f.get("password")));
    if(!auth.currentUser.emailVerified){await auth.signOut();var er=new Error("email-not-verified");er.code="auth/email-not-verified";throw er;}
    await InsurNex.loadIdentity();
    await enter();
  }

  async function doRegister(f){
    var password=String(f.get("password")||""), confirm=String(f.get("confirmPassword")||"");
    if(password!==confirm){var e=new Error("mismatch");e.code="auth/password-mismatch";throw e;}
    var c=await auth.createUserWithEmailAndPassword(String(f.get("email")).trim(),password);
    var uid=c.user.uid,type=String(f.get("accountType")||"individual_broker"),batch=db.batch();
    var roles=type==="brokerage_company"?["organizationOwner","broker"]:
      type==="manager"?["manager"]:
      type==="customer"?["customer"]:["broker"];
    var userData={
      uid:uid,email:c.user.email,name:String(f.get("name")||""),mobile:String(f.get("mobile")||""),
      country:String(f.get("country")||""),city:String(f.get("city")||""),accountType:type,roles:roles,
      onboardingComplete:false,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    batch.set(db.collection("users").doc(uid),userData);
    batch.set(db.collection("brokerProfiles").doc(uid),{
      userId:uid,licenseNumber:String(f.get("companyLicense")||""),specialization:String(f.get("specialization")||""),
      companyName:String(f.get("companyName")||""),createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    var createdWorkspace=null;
    if(type==="brokerage_company"){
      var org=db.collection("organizations").doc(),name=String(f.get("name")||f.get("legalName")||"InsurNex Brokerage");
      batch.set(org,{
        name:name,legalName:String(f.get("legalName")||name),ownerId:uid,licenseNumber:String(f.get("companyLicense")||""),
        registrationNumber:String(f.get("registrationNumber")||""),country:String(f.get("country")||""),
        city:String(f.get("city")||""),address:String(f.get("companyAddress")||""),website:String(f.get("website")||""),
        employeeCount:Number(f.get("employees")||0),primaryContact:String(f.get("name")||""),status:"active",
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      batch.set(db.collection("organizationMembers").doc(org.id+"_"+uid),{
        organizationId:org.id,organizationName:name,userId:uid,role:"organizationOwner",status:"active",
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      createdWorkspace={type:"organization",id:org.id,name:name};
    }
    await batch.commit();
    if(createdWorkspace)InsurNex.setWorkspace(createdWorkspace);
    try{await c.user.sendEmailVerification();}catch(e){}
    await InsurNex.loadIdentity();
    toast(t("accountCreated"));
    await enter();
  }

  async function forgot(){
    var email=prompt(t("email"));
    if(!email)return;
    try{await auth.sendPasswordResetEmail(email.trim());toast(t("resetSent"));}catch(e){toast(friendlyError(e),"error");}

      '</nav><div class="drawer" id="drawer"><div class="drawer-panel"><div class="drawer-head"><strong>InsurNex</strong>'+
      '<button class="close" id="closeDrawer">×</button></div>'+links+
      '<div class="workspace-card" style="margin-top:12px"><div>'+(state.workspace.type==="organization"?"🏢":"👤")+
      '</div><div><div class="list-title">'+esc(state.workspace.name||t("personalWorkspace"))+
      '</div><div class="list-sub">'+esc((state.profile&&state.profile.roles||["broker"]).join(" · "))+
      '</div></div></div><button class="btn" id="switchWorkspace" style="margin-top:10px">'+t("switchWorkspace")+
      '</button><button class="btn btn-danger" id="logoutDrawer" style="margin-top:10px">'+t("logout")+
      '</button></div></div></div>';

    document.querySelectorAll("[data-nav]").forEach(function(b){b.onclick=function(e){e.preventDefault();navigate(b.dataset.nav);var d=document.getElementById("drawer");if(d)d.classList.remove("show");};});
    document.getElementById("menu").onclick=function(){document.getElementById("drawer").classList.add("show");};
    document.getElementById("openMenu").onclick=function(){document.getElementById("drawer").classList.add("show");};
    document.getElementById("closeDrawer").onclick=function(){document.getElementById("drawer").classList.remove("show");};
    document.getElementById("drawer").onclick=function(e){if(e.target.id==="drawer")e.currentTarget.classList.remove("show");};
    document.getElementById("logout").onclick=logout;
    document.getElementById("logoutDrawer").onclick=logout;
    document.getElementById("lang").onclick=function(){InsurNex.setLanguage(InsurNex.locale()==="ar"?"en":"ar");shell();render();};
    document.getElementById("switchWorkspace").onclick=switchWorkspace;
    document.getElementById("globalSearch").onclick=globalSearch;
  }

  async function switchWorkspace(){
    var opts=[{type:"personal",id:null,name:t("personalWorkspace")}].concat(state.memberships.map(function(m){
      return {type:"organization",id:m.organizationId,name:m.organizationName||t("organizationWorkspace")};
    }));
    if(opts.length===1){toast(t("personalWorkspace"));return;}
    var n=prompt(opts.map(function(o,i){return(i+1)+". "+o.name;}).join("\n")),i=parseInt(n,10)-1;
    if(opts[i]){InsurNex.setWorkspace(opts[i]);shell();render();}
  }

  async function enter(){
    shell();
    if(!(state.profile&&state.profile.onboardingComplete)){onboarding();}else{await render();}
  }

  function onboarding(){
    var p=state.profile||{}, company=state.profile?.accountType==="brokerage_company";

  async function syncRenewalAutomation(policies,existingRenewals){
    function checkpoint(days){
      if(days<=0)return "Expired";
      if(days<=7)return "7 Days";
      if(days<=15)return "15 Days";
      if(days<=30)return "30 Days";
      if(days<=45)return "45 Days";
      if(days<=60)return "60 Days";
      if(days<=90)return "90 Days";
      return null;
    }
    var current=existingRenewals||[];
    for(var i=0;i<policies.length;i++){
      var p=policies[i],expiry=p.expiryDate?new Date(p.expiryDate):null;
      if(!expiry||Number.isNaN(expiry.getTime()))continue;
      var days=Math.ceil((expiry.getTime()-Date.now())/86400000),stage=checkpoint(days);
      if(!stage)continue;
      var exists=current.some(function(r){return (r.policyId===p.id||r.policyNumber===p.policyNumber)&&r.stage===stage;});
      if(exists)continue;
      var key=String(p.id||p.policyNumber||"policy").replace(/[^a-zA-Z0-9_-]/g,"_")+"_"+stage.replace(/\s+/g,"_");
      var renewalData=InsurNex.docPayload({policyId:p.id,policyNumber:p.policyNumber||"",customerId:p.customerId||null,customerName:p.customerName||"",expiryDate:p.expiryDate,stage:stage,status:"Open",assignedBrokerName:state.profile?.name||""});
      await db.collection("renewals").doc(key).set(renewalData,{merge:true});
      await db.collection("tasks").doc(key+"_task").set(InsurNex.docPayload({title:"Renew "+(p.policyNumber||"policy"),description:"Policy expires in "+days+" days.",dueDate:p.expiryDate,priority:days<=15?"high":"medium",status:"To Do",linkedEntityType:"renewal",linkedEntityId:key}),{merge:true});
      await db.collection("notifications").doc(key+"_notification").set({recipientId:state.user.uid,title:"Renewal reminder",body:"Policy "+(p.policyNumber||"")+" reaches "+stage+" reminder stage.",type:"renewal",organizationId:state.workspace.type==="organization"?state.workspace.id:null,createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false},{merge:true});
      current.push({...renewalData,stage});
    }
    state.cache.clear();
  }

  async function edit(viewName,id){
    var def=Domain[viewName];if(!def)return;
    if(!id&&!InsurNex.can(viewName,"write")){toast(t("noPermission"),"error");return;}
    var cached=state.cache.get(def.collection)||[],row=id?(cached.find(function(x){return x.id===id;})||{}):{};
    modal(id?t("edit"):t("add"),formHtml(viewName,row));
    document.getElementById("recordForm").onsubmit=async function(e){
      e.preventDefault();var f=new FormData(e.currentTarget),d={};
      def.fields.forEach(function(x){var v=f.get(x[0]);d[x[0]]=x[2]==="number"&&v!==""?Number(v):v;});
      try{
        if(id){
          var existing=row;await db.collection(def.collection).doc(id).update(Object.assign({},d,{updatedAt:firebase.firestore.FieldValue.serverTimestamp()}));
          await InsurNex.writeAudit("update",def.collection,id,{},existing,Object.assign({},existing,d));
          await InsurNex.logActivity("update",def.collection+" / "+id);
        }else{
          var ref=await db.collection(def.collection).add(InsurNex.docPayload(d));
          await InsurNex.writeAudit("create",def.collection,ref.id,{},null,d);
          await InsurNex.logActivity("create",def.collection+" / "+ref.id);
          if(def.collection==="policies"&&Number(d.commissionAmount||0)>0){
            await db.collection("commissions").add(InsurNex.docPayload({
              policyNumber:d.policyNumber,customerName:d.customerName,insurer:d.insurer,brokerName:state.profile?.name||"",
              premium:Number(d.premium||0),commissionRate:Number(d.commissionRate||0),commissionAmount:Number(d.commissionAmount||0),
              paidCommission:0,commissionDate:d.startDate||null,status:"Expected"
            }));
          }
        }
        state.cache.clear();closeModal();toast(t("saved"));render();
      }catch(err){toast(friendlyError(err),"error");}
    };
  }

        var data=InsurNex.docPayload({name:f.get("name"),entityType:f.get("entityType"),entityId:f.get("entityId"),category:f.get("category"),
          fileName:file.name,mimeType:file.type,size:file.size,storagePath:path,url:url,status:"active"});
        var snap=await db.collection("documents").add(data);await InsurNex.writeAudit("create","documents",snap.id);state.cache.clear();closeModal();toast(t("saved"));render();
      }catch(err){toast(friendlyError(err),"error");}

  async function crossSellSuggestions(customersRows,policies){
    var result=[];
    var lines=["Motor","Medical","Life","Property","Travel","Marine","Engineering","Liability"];
    customersRows.slice(0,50).forEach(function(c){
      var types=policies.filter(function(p){return p.customerName===c.fullName||p.customerId===c.id;}).map(function(p){return String(p.insuranceType||"");});
      if(!types.length)return;
      var missing=lines.find(function(x){return !types.includes(x);});
      if(missing)result.push({customer:c.fullName,suggestion:missing+" insurance may be a potential cross-sell."});
    });
    return result;
  }

  function csvExport(rows,fileName){
    if(!rows.length){toast(t("empty"),"error");return;}
    var keys=Object.keys(rows[0]).filter(function(k){return k!=="id";});
    var out=[keys.join(",")].concat(rows.map(function(r){return keys.map(function(k){var v=r[k];if(v&&v.toDate)v=v.toDate().toISOString();v=String(v==null?"":v).replace(/"/g,'""');return '"'+v+'"';}).join(",");}));
    var blob=new Blob(["\ufeff"+out.join("\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=fileName;a.click();URL.revokeObjectURL(url);
  }
