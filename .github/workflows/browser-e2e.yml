name: InsurNex Browser E2E

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_EMAIL: ${{ secrets.INSURNEX_E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.INSURNEX_E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright@latest

      - name: Setup Java for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --directory . > /tmp/insurnex-http.log 2>&1 &
          echo $! > /tmp/insurnex-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/InsurNex-User.html >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/insurnex-http.log
          exit 1

      - name: Inspect optional E2E credentials
        run: |
          node - <<'NODE'
          const email = String(process.env.E2E_EMAIL || '').trim();
          const password = String(process.env.E2E_PASSWORD || '');
          const emailShape = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          console.log(JSON.stringify({
            configuredEmailShape: emailShape,
            configuredEmailLength: email.length,
            configuredPasswordPresent: Boolean(password),
            mode: emailShape && password ? 'configured-account-with-disposable-fallback' : 'disposable-account'
          }));
          NODE

      - name: Run baseline desktop + mobile browser E2E
        run: node tests/e2e/browser-e2e.cjs

      - name: Run CRM business workflow E2E with explicit emulator readiness
        env:
          E2E_FIREBASE_EMULATOR: "1"
          E2E_FIREBASE_PROJECT_ID: demo-insurnex
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest emulators:start             --only auth,firestore             --project demo-insurnex             --non-interactive             > /tmp/insurnex-emulators.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for Firebase Auth and Firestore emulators..."
          for i in $(seq 1 60); do
            auth_ok=false
            firestore_ok=false
            if curl -sS -o /dev/null --max-time 2 http://127.0.0.1:9099/; then auth_ok=true; fi
            if curl -sS -o /dev/null --max-time 2 http://127.0.0.1:8080/; then firestore_ok=true; fi
            if [ "$auth_ok" = true ] && [ "$firestore_ok" = true ]; then
              echo "Firebase emulators are ready."
              break
            fi
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo "Firebase emulator process exited before readiness."
              cat /tmp/insurnex-emulators.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -sS -o /dev/null --max-time 2 http://127.0.0.1:9099/; then
            echo "Firebase Auth emulator did not become ready."
            cat /tmp/insurnex-emulators.log
            exit 1
          fi
          if ! curl -sS -o /dev/null --max-time 2 http://127.0.0.1:8080/; then
            echo "Firestore emulator did not become ready."
            cat /tmp/insurnex-emulators.log
            exit 1
          fi

          node tests/e2e/crm-business-workflow-e2e.cjs
