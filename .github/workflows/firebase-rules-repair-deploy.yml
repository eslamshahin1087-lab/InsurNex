name: InsurNex Firebase Rules Repair Deploy

on:
  push:
    branches:
      - test/crm-business-workflow-e2e-2026-10-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Firebase deployment credential
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN GitHub Secret is not configured for this repository."
            exit 2
          fi
          echo "Firebase deployment credential is available."

      - name: Validate Firestore Rules locally
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-insurnex "npm run test:rules"

      - name: Deploy Firestore Rules to InsurNex
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project insurnex-8a9df --token "$FIREBASE_TOKEN" --non-interactive

      - name: Confirm deployment command completed
        run: echo "Firestore rules deployment completed for insurnex-8a9df."
