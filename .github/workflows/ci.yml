name: InsurNex CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Repository smoke test
        run: node scripts/smoke-test.cjs
      - name: Syntax check
        run: |
          node --check js/config.js
          node --check js/core.js
          node --check js/user.js
          node --check js/admin.js
      - name: Validate Firebase rules
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-insurnex "node -e \"console.log('Firestore rules loaded')\""
