name: InsurNex CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test dependencies
        run: npm install --no-package-lock
      - name: Repository smoke test
        run: npm test
      - name: Syntax check
        run: |
          node --check js/config.js
          node --check js/core.js
          node --check js/user.js
          node --check js/admin-app.js
          node --check scripts/migrate-legacy-data.cjs
          node --check scripts/migration-utils.cjs
          node --check scripts/migration-test.cjs
          node --check scripts/check-firebase-auth.cjs
          node --check scripts/firestore-rules-test.cjs
      - name: Validate Firebase rules
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-insurnex "npm run test:rules"
