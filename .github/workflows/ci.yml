name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admin and user access boundary smoke checks
        run: npm run test:access
      - name: Plan feature entitlement smoke checks
        run: npm run test:plans
      - name: PWA installability and privacy smoke checks
        run: npm run test:pwa
      - name: Documents route regression checks
        run: npm run test:documents-route
      - name: Copilot client-data minimization regression checks
        run: npm run test:copilot-minimization
      - name: Copilot session-context minimization regression checks
        run: npm run test:copilot-session-context
      - name: Visual identity and responsive layout regression checks
        run: npm run test:visual-identity
      - name: Document storage authorization policy regression tests
        run: npm run test:storage-gateway
      - name: Set up Deno for Supabase Edge Function type-checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase document storage Edge Function
        run: deno check supabase/functions/document-storage/index.ts
      - name: Type-check Supabase AI Copilot Edge Function
        run: deno check supabase/functions/copilot-chat/index.ts
      - name: Copilot context minimization regression tests
        run: deno test supabase/functions/copilot-chat/context-sanitizer.test.ts supabase/functions/copilot-chat/workspace-authorization.test.ts supabase/functions/copilot-chat/trusted-context.test.ts supabase/functions/copilot-chat/client-context-selector.test.ts supabase/functions/copilot-chat/api-key-authorization.test.ts supabase/functions/copilot-chat/copilot-context-route.test.ts
      - name: Copilot context contract and Firestore index regression checks
        run: npm run test:copilot-context-contract
      - name: Copilot gateway safe-error regression checks
        run: npm run test:copilot-safe-errors
      - name: Legacy storage inventory reconciliation regression tests
        run: npm run test:storage-inventory
      - name: Legacy client document backfill planning regression tests
        run: npm run test:legacy-client-backfill-plan
      - name: Client sensitive-field inventory regression tests
        run: npm run test:client-sensitive-inventory
      - name: Client sensitive-data separation planner regression tests
        run: npm run test:client-sensitive-separation-plan
      - run: npm run lint
      - run: npm run build
      - name: Build Firebase Functions
        run: |
          npm ci --prefix functions
          npm run build --prefix functions
      - name: Legacy Firebase Copilot context security regression tests
        run: node functions/scripts/copilot-context-security-test.mjs
      - name: Verify read-only storage audit CLIs start without cloud access
        run: |
          node functions/scripts/legacy-storage-dry-run.mjs --help
          node functions/scripts/legacy-client-document-backfill-plan.mjs --help
          node functions/scripts/client-sensitive-data-inventory.mjs --help
          node functions/scripts/client-sensitive-data-separation-plan.mjs --help
      - name: Set up Java 21 for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore security rules regression tests (demo emulator only)
        run: npx --yes firebase-tools emulators:exec --project demo-insurnex --only auth,firestore "GCLOUD_PROJECT=demo-insurnex node scripts/firestore-rules-test.mjs"
