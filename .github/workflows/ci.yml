name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admin and user access boundary smoke checks
        run: npm run test:access
      - name: Plan feature entitlement smoke checks
        run: npm run test:plans
      - name: PWA installability and privacy smoke checks
        run: npm run test:pwa
      - name: Document storage authorization policy regression tests
        run: npm run test:storage-gateway
      - name: Legacy storage inventory reconciliation regression tests
        run: npm run test:storage-inventory
      - name: Legacy client document backfill planning regression tests
        run: npm run test:legacy-client-backfill-plan
      - run: npm run lint
      - run: npm run build
      - name: Build Firebase Functions
        run: |
          npm ci --prefix functions
          npm run build --prefix functions
      - name: Verify legacy storage dry-run CLI starts without cloud access
        run: node functions/scripts/legacy-storage-dry-run.mjs --help
      - name: Set up Java 21 for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore security rules regression tests (demo emulator only)
        run: npx --yes firebase-tools emulators:exec --project demo-insurnex --only auth,firestore "GCLOUD_PROJECT=demo-insurnex node scripts/firestore-rules-test.mjs"
